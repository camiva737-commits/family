<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Devoluciones · Distribuidora TAT</title>
<script src="auth.js"></script>

<link rel="stylesheet" href="tema.css">
<style>
  .tabs { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--borde); box-shadow: var(--shadow-1); }
  .tabs button { flex: 1; padding: 12px; border: none; border-radius: 10px; background: transparent; color: var(--suave); font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; font-family: inherit; }
  .tabs button.active { background: var(--acento); color: #FFF; box-shadow: 0 2px 8px rgba(242, 140, 0, 0.3); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .fotos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .foto-item { position: relative; aspect-ratio: 1; background: var(--input); border-radius: 10px; overflow: hidden; }
  .foto-item img { width: 100%; height: 100%; object-fit: cover; }
  .foto-item .btn-x { position: absolute; top: 4px; right: 4px; background: var(--peligro); color: #FFF; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .foto-vacia { aspect-ratio: 1; background: var(--input); border: 2px dashed var(--borde); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--suave); font-size: 26px; cursor: pointer; transition: 0.15s; }
  .foto-vacia:hover { border-color: var(--acento); color: var(--acento); background: var(--acento-suave); }
  .producto-sel { background: var(--acento-suave); padding: 12px; border-radius: 12px; margin-bottom: 12px; border-left: 3px solid var(--acento); }
  .producto-sel-lbl { font-size: 11px; color: var(--primario); font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 4px; }
  .producto-sel-nombre { font-size: 15px; font-weight: 700; color: var(--texto); }
  .dev-resultado { padding: 12px; background: var(--card); border-bottom: 1px solid var(--borde); cursor: pointer; transition: 0.1s; }
  .dev-resultado:hover { background: var(--input-hover); }
  .dev-resultado strong { font-size: 14px; color: var(--texto); }
  .dev-resultado span { font-size: 12px; color: var(--suave); }
  .dev-item { background: var(--card); border: 1px solid var(--borde); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; border-left: 4px solid var(--borde); box-shadow: var(--shadow-1); transition: 0.15s; }
  .dev-item:hover { transform: translateX(2px); box-shadow: var(--shadow-2); }
  .dev-item.pendiente { border-left-color: var(--peligro); }
  .dev-item.en_proceso { border-left-color: var(--warning); }
  .dev-item.cambio_recibido { border-left-color: var(--info); }
  .dev-item.cerrada { border-left-color: var(--ok); opacity: 0.7; }
  .dev-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
  .dev-header h4 { font-size: 14px; font-weight: 700; margin: 0; color: var(--texto); flex: 1; }
  .dev-badge { display: inline-block; padding: 3px 10px; border-radius: 9999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; flex-shrink: 0; }
  .dev-badge.pendiente { background: var(--peligro-bg); color: var(--peligro); }
  .dev-badge.en_proceso { background: var(--warning-bg); color: var(--warning); }
  .dev-badge.cambio_recibido { background: var(--info-bg); color: var(--info); }
  .dev-badge.cerrada { background: var(--ok-bg); color: var(--ok); }
  .dev-item p { font-size: 12px; color: var(--suave); margin: 3px 0; }
  .dev-fotos { display: flex; gap: 4px; margin-top: 8px; }
  .dev-fotos img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid var(--borde); }
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .modal-content { background: var(--card); border-radius: 16px; max-width: 500px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-3); border: 1px solid var(--borde); }
  .modal-header { padding: 16px; background: var(--input); border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { font-size: 16px; font-weight: 700; color: var(--texto); margin: 0; }
  .modal-header button { background: none; border: none; color: var(--suave); font-size: 22px; cursor: pointer; line-height: 1; }
  .modal-body { padding: 16px; overflow-y: auto; }
</style>
</head>

  <div class="tabs">
    <button id="tab-nueva-btn" class="active" onclick="cambiarTab('nueva')">➕ Nueva</button>
    <button id="tab-lista-btn" onclick="cambiarTab('lista')">📋 Listado</button>
  </div>

  <div id="estado" style="display: none;"></div>

  <div id="tab-nueva" class="tab-content active">
    <div class="card">
      <label class="label" style="display: block; margin-bottom: 8px;">Producto</label>
      <input type="text" id="dev-buscar" placeholder="🔍 Buscar producto..." oninput="buscarProducto()" autocomplete="off">
      <div id="dev-resultados" style="max-height: 250px; overflow-y: auto; border-radius: 12px; overflow: hidden; display: none; border: 1px solid var(--borde);"></div>
      <div id="dev-producto-sel" class="producto-sel" style="display: none;">
        <div class="producto-sel-lbl">Producto seleccionado</div>
        <div id="dev-producto-nombre" class="producto-sel-nombre"></div>
      </div>
    </div>
    
    <div class="card">
      <label class="label" style="display: block; margin-bottom: 8px;">Datos de la devolución</label>
      <input type="number" id="dev-cantidad" placeholder="Cantidad a devolver" min="1">
      <select id="dev-proveedor">
        <option value="">Proveedor (opcional)</option>
      </select>
      <input type="date" id="dev-fecha">
      <textarea id="dev-observacion" placeholder="Observaciones (opcional): describe el problema..." style="min-height: 80px; resize: vertical;"></textarea>
      
      <label class="label" style="display: block; margin-bottom: 8px; margin-top: 4px;">Fotos de evidencia (máx. 3)</label>
      <div class="fotos-grid" id="fotos-grid">
        <div class="foto-vacia" onclick="document.getElementById('foto-input').click()">📷</div>
      </div>
      <input type="file" id="foto-input" accept="image/*" capture="environment" style="display: none;" onchange="agregarFoto(this)">
    </div>
    
    <button class="btn-primario" id="btn-crear" onclick="crearDevolucion()">Registrar Devolución</button>
  </div>

  <div id="tab-lista" class="tab-content">
    <div class="card">
      <select id="filtro-estado" onchange="cargarListado()">
        <option value="">Todos los estados</option>
        <option value="Pendiente">Pendiente</option>
        <option value="En_proceso">En proceso</option>
        <option value="Cambio_recibido">Cambio recibido</option>
        <option value="Cerrada">Cerrada</option>
      </select>
      <input type="text" id="filtro-busqueda" placeholder="🔍 Buscar por producto..." oninput="cargarListado()">
    </div>
    <div id="lista-devoluciones">
      <div class="empty-state">
        <div class="empty-state-icon">⏳</div>

  <div id="modal-detalle" class="modal" onclick="if(event.target.id==='modal-detalle')cerrarDetalle()">
    <div class="modal-content">

<!-- Burbuja del Dashboard (volver al inicio) -->
<div id="dashboard-mascota" onclick="window.location.href='index.html'" style="position:fixed; bottom:160px; right:20px; width:56px; height:56px; border-radius:50%; background:var(--info); color:#FFF; display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; box-shadow:0 6px 20px rgba(59,130,246,0.4); z-index:9996; transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" title="Ir al inicio">📊</div>
<script>
let productos = [];
let proveedores = [];
let productoSeleccionado = null;
let fotosSubidas = [];
let devolucionesActuales = [];
let devActual = null;

(async function init() {
  document.getElementById('dev-fecha').value = new Date().toISOString().split('T')[0];
  
  try {
    const r = await apiGet('accion=inventario');
    if (r.ok) productos = r.items;
  } catch (e) { console.error('Error productos:', e); }
  
  try {
    const r = await apiPost({ accion: 'listar_proveedores' }, 30);
    if (r.ok && r.items) {
      proveedores = r.items;
      const select = document.getElementById('dev-proveedor');
      r.items.forEach(function(p) {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.nombre;
        select.appendChild(opt);
      });
    }
  } catch (e) { console.error('Error proveedores:', e); }
})();

function cambiarTab(tab) {
  document.getElementById('tab-nueva-btn').classList.remove('active');
  document.getElementById('tab-lista-btn').classList.remove('active');
  document.getElementById('tab-nueva').classList.remove('active');
  document.getElementById('tab-lista').classList.remove('active');
  
  if (tab === 'nueva') {
    document.getElementById('tab-nueva-btn').classList.add('active');
    document.getElementById('tab-nueva').classList.add('active');
  } else {
    document.getElementById('tab-lista-btn').classList.add('active');
    document.getElementById('tab-lista').classList.add('active');
    cargarListado();
  }
}

function buscarProducto() {
  const q = document.getElementById('dev-buscar').value.toLowerCase().trim();
  const cont = document.getElementById('dev-resultados');
  
  if (q.length < 2) {
    cont.style.display = 'none';
    return;
  }
  
  const filtrados = productos.filter(function(p) {
    return p.nombre.toLowerCase().includes(q) || p.id.toLowerCase().includes(q);
  }).slice(0, 10);
  
  if (filtrados.length === 0) {
    cont.innerHTML = '<div style="padding: 12px; color: var(--suave); text-align: center; font-size: 13px;">No encontrado</div>';
    cont.style.display = 'block';
    return;
  }
  
  cont.innerHTML = '';
  filtrados.forEach(function(p) {
    const div = document.createElement('div');
    div.className = 'dev-resultado';
    div.innerHTML = '<strong>' + p.nombre + '</strong> <span>(stock: ' + p.stock_actual + ' ' + p.unidad_base + ')</span>';
    div.onclick = function() { seleccionarProducto(p); };
    cont.appendChild(div);
  });
  cont.style.display = 'block';
}

function seleccionarProducto(p) {
  productoSeleccionado = p;
  document.getElementById('dev-producto-nombre').textContent = p.nombre + ' (' + p.id + ')';
  document.getElementById('dev-producto-sel').style.display = 'block';
  document.getElementById('dev-buscar').value = '';
  document.getElementById('dev-resultados').style.display = 'none';
}

function agregarFoto(input) {
  const file = input.files[0];
  if (!file) return;
  if (fotosSubidas.length >= 3) {
    alert('Máximo 3 fotos');
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    fotosSubidas.push({ base64: e.target.result, url: '' });
    renderizarFotos();
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function renderizarFotos() {
  const grid = document.getElementById('fotos-grid');
  grid.innerHTML = '';
  
  fotosSubidas.forEach(function(foto, i) {
    const div = document.createElement('div');
    div.className = 'foto-item';
    div.innerHTML = '<img src="' + foto.base64 + '"><button class="btn-x" onclick="eliminarFoto(' + i + ')">×</button>';
    grid.appendChild(div);
  });
  
  if (fotosSubidas.length < 3) {
    const div = document.createElement('div');
    div.className = 'foto-vacia';
    div.textContent = '📷';
    div.onclick = function() { document.getElementById('foto-input').click(); };
    grid.appendChild(div);
  }
}

function eliminarFoto(index) {
  fotosSubidas.splice(index, 1);
  renderizarFotos();
}

async function crearDevolucion() {
  if (!productoSeleccionado) return alert('Selecciona un producto');
  const cantidad = Number(document.getElementById('dev-cantidad').value);
  if (!cantidad || cantidad <= 0) return alert('Cantidad inválida');
  
  const btn = document.getElementById('btn-crear');
  btn.textContent = 'Guardando...';
  btn.disabled = true;
  
  try {
    const urlsFotos = [];
    for (let i = 0; i < fotosSubidas.length; i++) {
      const r = await apiPost({
        accion: 'subir_foto_devolucion',
        base64: fotosSubidas[i].base64,
        id_devolucion: 'temp',
        indice: i + 1
      }, 60);
      if (r.ok && r.url) urlsFotos.push(r.url);
    }
    
    const datos = {
      id_producto: productoSeleccionado.id,
      cantidad: cantidad,
      fecha: document.getElementById('dev-fecha').value,
      id_proveedor: document.getElementById('dev-proveedor').value,
      observacion: document.getElementById('dev-observacion').value.trim(),
      foto_urls: urlsFotos
    };
    
    const r = await apiPost({ accion: 'crear_devolucion', datos: datos }, 60);
    if (r.ok) {
      alert('✅ Devolución registrada: ' + r.id_devolucion);
      productoSeleccionado = null;
      document.getElementById('dev-producto-sel').style.display = 'none';
      document.getElementById('dev-cantidad').value = '';
      document.getElementById('dev-observacion').value = '';
      document.getElementById('dev-fecha').value = new Date().toISOString().split('T')[0];
      fotosSubidas = [];
      renderizarFotos();
      cambiarTab('lista');
    } else {
      alert('❌ Error: ' + r.error);
    }
  } catch (e) {
    alert('❌ Error de conexión: ' + e.message);
  } finally {
    btn.textContent = 'Registrar Devolución';
    btn.disabled = false;
  }
}

async function cargarListado() {
  const cont = document.getElementById('lista-devoluciones');
  cont.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-text">Cargando...</div></div>';
  
  const filtros = {
    estado: document.getElementById('filtro-estado').value,
    busqueda: document.getElementById('filtro-busqueda').value
  };
  
  try {
    const r = await apiPost({ accion: 'listar_devoluciones', filtros: filtros }, 30);
    if (!r.ok) throw new Error(r.error);
    
    devolucionesActuales = r.items || [];
    
    if (devolucionesActuales.length === 0) {
      cont.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">No hay devoluciones registradas.</div></div>';
      return;
    }
    
    let html = '<p style="text-align: center; color: var(--suave); font-size: 12px; margin-bottom: 12px;">' + devolucionesActuales.length + ' devolución(es)</p>';
    
    devolucionesActuales.forEach(function(d) {
      const estadoClass = d.estado.toLowerCase().replace(/_/g, '_');
      const fecha = d.fecha ? formatFecha(d.fecha) : 'Sin fecha';
      
      let fotosHtml = '';
      if (d.foto_urls.length > 0) {
        fotosHtml = '<div class="dev-fotos">';
        d.foto_urls.slice(0, 3).forEach(function(url) {
          fotosHtml += '<img src="' + url + '">';
        });
        fotosHtml += '</div>';
      }
      
      html += '<div class="dev-item ' + estadoClass + '" onclick="verDetalle(\'' + d.id + '\')">' +
        '<div class="dev-header">' +
          '<h4>' + d.nombre_producto + '</h4>' +
          '<span class="dev-badge ' + estadoClass + '">' + d.estado + '</span>' +
        '</div>' +
        '<p>🎯 ' + d.id + ' · ' + fecha + '</p>' +
        '<p>📦 ' + d.cantidad + ' ' + d.unidad.toLowerCase() + '(s) · Pendiente: ' + d.cantidad_pendiente + '</p>' +
        (d.nombre_proveedor ? '<p>🏢 ' + d.nombre_proveedor + '</p>' : '') +
        fotosHtml +
      '</div>';
    });
    
    cont.innerHTML = html;
  } catch (e) {
    cont.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-text" style="color: var(--peligro);">Error: ' + e.message + '</div></div>';
  }
}

function formatFecha(fecha) {
  if (!fecha) return '';
  const d = new Date(fecha);
  const dia = String(d.getDate()).padStart(2, '0');
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const año = d.getFullYear();
  return dia + '/' + mes + '/' + año;
}

function verDetalle(id) {
  const dev = devolucionesActuales.find(function(d) { return d.id === id; });
  if (!dev) return;
  
  devActual = dev;
  const modal = document.getElementById('modal-detalle');
  const contenido = document.getElementById('detalle-contenido');
  
  const estados = ['Pendiente', 'En_proceso', 'Cambio_recibido', 'Cerrada'];
  let estadosHtml = '<select id="nuevo-estado" style="margin-bottom: 12px;">';
  estados.forEach(function(e) {
    estadosHtml += '<option value="' + e + '"' + (dev.estado === e ? ' selected' : '') + '>' + e.replace(/_/g, ' ') + '</option>';
  });
  estadosHtml += '</select>';
  
  let fotosHtml = '';
  if (dev.foto_urls.length > 0) {
    fotosHtml = '<p style="font-size: 13px; color: var(--suave); margin-bottom: 8px;">Fotos:</p><div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">';
    dev.foto_urls.forEach(function(url) {
      fotosHtml += '<a href="' + url + '" target="_blank"><img src="' + url + '" style="width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 1px solid var(--borde);"></a>';
    });
    fotosHtml += '</div>';
  }
  
  contenido.innerHTML = 
    '<h3 style="font-size: 18px; font-weight: 700; margin-bottom: 6px; color: var(--texto);">' + dev.nombre_producto + '</h3>' +
    '<p style="font-size: 12px; color: var(--suave); margin-bottom: 14px;">' + dev.id + '</p>' +
    '<div style="background: var(--input); padding: 14px; border-radius: 12px; margin-bottom: 14px;">' +
      '<p style="margin-bottom: 6px; font-size: 13px;"><strong>Cantidad:</strong> ' + dev.cantidad + ' ' + dev.unidad.toLowerCase() + '(s)</p>' +
      '<p style="margin-bottom: 6px; font-size: 13px;"><strong>Pendiente:</strong> ' + dev.cantidad_pendiente + '</p>' +
      '<p style="margin-bottom: 6px; font-size: 13px;"><strong>Fecha:</strong> ' + (dev.fecha ? formatFecha(dev.fecha) : 'Sin fecha') + '</p>' +
      (dev.nombre_proveedor ? '<p style="margin-bottom: 6px; font-size: 13px;"><strong>Proveedor:</strong> ' + dev.nombre_proveedor + '</p>' : '') +
      (dev.observacion ? '<p style="margin-bottom: 0; font-size: 13px;"><strong>Observación:</strong><br>' + dev.observacion + '</p>' : '') +
    '</div>' +
    fotosHtml +
    '<hr style="margin: 16px 0; border: none; border-top: 1px solid var(--borde);">' +
    '<p class="label" style="margin-bottom: 8px; display: block;">Cambiar estado</p>' +
    estadosHtml +
    '<input type="number" id="cantidad-recibida" placeholder="Cantidad recibida (si aplica)" min="0" style="margin-bottom: 12px;">' +
    '<button class="btn-primario" onclick="actualizarEstado()">Guardar cambios</button>';
  
  modal.classList.add('open');
}

async function actualizarEstado() {
  if (!devActual) return;
  const nuevoEstado = document.getElementById('nuevo-estado').value;
  const cantidadRecibida = document.getElementById('cantidad-recibida').value;
  
  try {
    const r = await apiPost({
      accion: 'actualizar_estado_devolucion',
      id_devolucion: devActual.id,
      estado: nuevoEstado,
      cantidad_recibida: cantidadRecibida ? Number(cantidadRecibida) : null
    }, 30);
    
    if (r.ok) {
      alert('✅ Estado actualizado');
      cerrarDetalle();
      cargarListado();
    } else {
      alert('❌ Error: ' + r.error);
    }
  } catch (e) {
    alert('❌ Error: ' + e.message);
  }
}

function cerrarDetalle() {
  document.getElementById('modal-detalle').classList.remove('open');
  devActual = null;
}

</script>
</body>
</html>
