<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Salidas · Distribuidora TAT</title>
<script src="comun.js?v=10"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css">
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
<style>
  :root {
    --bg: #0F111A; --card: #1A1D2D; --input: #25293D; --texto: #F8FAFC; 
    --suave: #94A3B8; --borde: #334155; --acento: #EF4444; --peligro: #DC2626; --ok: #10B981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--texto); padding: 20px; padding-bottom: 50px; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 { font-size: 24px; color: var(--acento); font-weight: 800; }
  .btn-volver { background: none; border: none; color: var(--suave); font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; }

  #estado { padding: 14px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 16px; display: none; white-space: pre-line; }
  .ok { background: rgba(16, 185, 129, 0.2); color: var(--ok); border: 1px solid var(--ok); }
  .error { background: rgba(239, 68, 68, 0.2); color: var(--peligro); border: 1px solid var(--peligro); }

  input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--borde); background: var(--input); color: var(--texto); font-size: 16px; margin-bottom: 12px; outline: none; }
  
  .card { background: var(--card); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--borde); }
  
  .linea { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--borde); cursor: pointer; }
  .linea:last-child { border-bottom: none; }
  .linea-info { flex: 1; }
  .linea-info h4 { font-size: 15px; }
  .linea-info p { font-size: 13px; color: var(--suave); margin-top: 4px; }
  .badge-unidad { display: inline-block; background: var(--borde); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-left: 6px; color: var(--texto); }
  
  /* Estilo para los no reconocidos */
  .pendiente { border-left: 4px solid var(--peligro); padding-left: 12px; background: rgba(239, 68, 68, 0.05); border-radius: 4px; }
  .pendiente h4 { color: var(--peligro); }
  
  .btn-eliminar { background: none; border: none; color: var(--peligro); font-size: 20px; cursor: pointer; padding: 5px; }
  .alerta-stock { color: var(--peligro); font-weight: bold; font-size: 12px; margin-top: 4px; display: block; }

  .btn-primario { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--acento); color: #FFF; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
  .btn-secundario { width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed var(--acento); background: transparent; color: var(--acento); font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn-limpiar { background: none; border: none; color: var(--suave); font-size: 13px; cursor: pointer; margin-top: 15px; text-align: center; display: block; width: 100%; text-decoration: underline; }

  #buscador-wrapper { display: none; background: var(--bg); position: sticky; top: 0; padding: 10px 0; z-index: 10; }
  .resultado { padding: 12px; background: var(--card); border-bottom: 1px solid var(--borde); cursor: pointer; }
  .resultado:active { background: var(--input); }

  .input-camara-group { display: flex; gap: 10px; align-items: stretch; margin-bottom: 12px; }
  .input-camara-group input { margin-bottom: 0; flex: 1; min-width: 0; }
  .btn-camara { padding: 0 16px; border-radius: 12px; background: var(--acento); border: none; font-size: 20px; color: #FFF; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-camara:disabled { opacity: 0.5; }
    /* Botón "+ Nuevo cliente" */
  .btn-nuevo-cli { width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed var(--acento); background: transparent; color: var(--acento); font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
  .btn-nuevo-cli:active { background: rgba(239, 68, 68, 0.1); }

  /* Modal de nuevo cliente */
  .modal-cli { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-cli.open { display: flex; }
  .modal-cli-content { background: var(--card); border-radius: 18px; max-width: 460px; width: 100%; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid var(--borde); }
  .modal-cli-header { padding: 16px; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: center; }
  .modal-cli-body { padding: 16px; overflow-y: auto; }
  .modal-cli-body label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 6px; font-weight: bold; margin-top: 12px; }
  .modal-cli-body label:first-child { margin-top: 0; }
  .modal-cli-body input { margin-bottom: 0; }
  .modal-cli-footer { padding: 12px 16px; border-top: 1px solid var(--borde); display: flex; gap: 10px; }
  .modal-cli-footer button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; }
  .btn-cancelar-cli { background: var(--input); color: var(--suave); }
  .btn-guardar-cli { background: var(--acento); color: #FFF; }
  .btn-guardar-cli:disabled { opacity: 0.5; }
</style>
</head>
<body>

  <div class="header">
    <h1>Salidas / Ventas</h1>
    <a href="index.html" class="btn-volver" onclick="return confirmarVolverSalida()">← Volver</a>
  </div>

  <div id="estado" class="ok" style="display: block;">Cargando productos...</div>

  <div class="card">
    <div class="input-camara-group">
      <input type="text" id="documento" placeholder="Número de factura / pedido" oninput="guardarBorrador()">
      <button class="btn-camara" onclick="document.getElementById('fotoCamara').click()">📷</button>
      <button class="btn-camara" onclick="document.getElementById('fotoGaleria').click()">🖼️</button>
      <button class="btn-camara" id="btn-microfono" title="Dictar por voz" onclick="iniciarDictado()">🎤</button>
    </div>
    <input type="file" id="fotoCamara" accept="image/*" capture="environment" style="display: none;" onchange="procesarFotoIA(this)">
    <input type="file" id="fotoGaleria" accept="image/*" style="display: none;" onchange="procesarFotoIA(this)">
    
        <div style="position:relative;">
  <input type="text" id="cliente-input" placeholder="Buscar cliente..." oninput="buscarCliente(this.value)" onfocus="buscarCliente(this.value)" autocomplete="off">
  <input type="hidden" id="cliente" value="esporadico" onchange="guardarBorrador()">
  <div id="cliente-resultados" style="display:none; position:absolute; top:100%; left:0; right:0; background:#1A1D2D; border:1px solid #334155; border-radius:12px; max-height:250px; overflow-y:auto; z-index:100; margin-top:4px;"></div>
</div>
<button class="btn-nuevo-cli" onclick="abrirNuevoCliente()">+ Nuevo cliente</button>
  </div>

  <div id="lista-lineas" class="card">
    <p style="text-align: center; color: var(--suave); font-size: 14px;">No hay productos agregados.</p>
  </div>

  <button class="btn-secundario" onclick="abrirBuscador(-1)">+ Agregar Producto Manualmente</button>
<button class="btn-primario" id="btn-guardar" onclick="guardarSalida()">Guardar Salida</button>
<button class="btn-secundario" onclick="limpiarSalida()" style="margin-top: 10px;">🗑️ Limpiar lista</button>

  <div id="buscador-wrapper">
    <input type="text" id="input-buscar" placeholder="Buscar producto..." oninput="filtrar()">
    <div id="resultados-busqueda" style="max-height: 300px; overflow-y: auto; border-radius: 12px; overflow: hidden;"></div>
    <button class="btn-volver" style="margin-top: 10px; color: var(--peligro);" onclick="cerrarBuscador()">Cancelar</button>
  </div>
    <!-- ==================== MODAL NUEVO CLIENTE ==================== -->
  <div id="modal-nuevo-cli" class="modal-cli" onclick="if(event.target.id==='modal-nuevo-cli')cerrarNuevoCliente()">
    <div class="modal-cli-content">
      <div class="modal-cli-header">
        <h3 style="font-size: 16px;">Nuevo cliente</h3>
        <button onclick="cerrarNuevoCliente()" style="background:none;border:none;color:var(--suave);font-size:22px;cursor:pointer;">×</button>
      </div>
      <div class="modal-cli-body">
        <label>Nombre *</label>
        <input type="text" id="nc-nombre" placeholder="Ej: Juan">

        <label>Apellido</label>
        <input type="text" id="nc-apellido" placeholder="Ej: Pérez">

        <label>Número / Teléfono</label>
        <input type="tel" id="nc-numero" placeholder="Ej: 3001234567">

        <label>Dirección</label>
        <input type="text" id="nc-direccion" placeholder="Ej: Calle 10 #5-20">
      </div>
      <div class="modal-cli-footer">
        <button class="btn-cancelar-cli" onclick="cerrarNuevoCliente()">Cancelar</button>
        <button class="btn-guardar-cli" id="nc-btn-guardar" onclick="guardarNuevoCliente()">Guardar</button>
      </div>
    </div>
  </div>

<div id="modal-recorte" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
  <p style="color:#FFF; font-size:16px; font-weight:bold; margin-bottom:10px; text-align:center;">
    Ajusta el recuadro para que solo quede la factura
  </p>
  <div style="width:100%; max-width:600px; height:60vh; background:#000; border-radius:12px; overflow:hidden;">
    <img id="imagen-a-recortar" style="max-width:100%; display:block;">
  </div>
<script>
let productos = [];
let lineasAgregadas = [];
let indexEditando = -1; // -1 = agregar nuevo; >= 0 = reemplazar pendiente

// --- 1. CARGAR BORRADOR Y CATÁLOGO ---
// --- CARGA INICIAL DEL CATÁLOGO Y CLIENTES ---
// --- CARGAR CLIENTES (solo para tenerlos en memoria) ---
let clientesCache = [];

(async function () {
 const borrador = localStorage.getItem('arqui_borrador_salida');
if (borrador) {
  try {
    const parsed = JSON.parse(borrador);
    lineasAgregadas = parsed.lineas || [];
    document.getElementById('documento').value = parsed.documento || '';
    if (parsed.cliente) {
      document.getElementById('cliente').value = parsed.cliente;
      document.getElementById('cliente-input').value = parsed.clienteNombre || '';
    }
    renderizarLineas();
  } catch(e) {}
}

  try {
    const r = await apiGet('accion=inventario');
    if (!r.ok) throw new Error(r.error);
    productos = r.items;
    document.getElementById('estado').style.display = 'none';
  } catch (err) {
    document.getElementById('estado').textContent = 'Error al cargar: ' + err.message;
  }
  
  // Cargar clientes en memoria
  try {
    const r = await apiGet('accion=clientes');
    if (r.ok) {
      clientesCache = r.items || [];
      console.log('✅ Clientes cargados:', clientesCache.length);
    }
  } catch (err) {
    console.error('Error cargando clientes:', err);
  }
})();

// --- BUSCADOR DE CLIENTES ---
function buscarCliente(texto) {
  const cont = document.getElementById('cliente-resultados');
  const q = (texto || '').toLowerCase().trim();
  
  if (q.length === 0) {
    // Mostrar "Esporádico" + los primeros 10 clientes
    let html = '<div class="cliente-item" onclick="seleccionarCliente(\'esporadico\', \'Cliente Esporádico / Mostrador\')" style="padding:12px; border-bottom:1px solid #334155; cursor:pointer;">Cliente Esporádico / Mostrador</div>';
    clientesCache.slice(0, 10).forEach(function(c) {
      html += '<div class="cliente-item" onclick="seleccionarCliente(\'' + c.id + '\', \'' + c.nombre.replace(/'/g, "\\'") + '\')" style="padding:12px; border-bottom:1px solid #334155; cursor:pointer;">' + c.nombre + (c.direccion ? ' (' + c.direccion + ')' : '') + '</div>';
    });
    cont.innerHTML = html;
    cont.style.display = 'block';
    return;
  }
  
  // Filtrar por nombre o ID
  const filtrados = clientesCache.filter(function(c) {
    return c.nombre.toLowerCase().indexOf(q) >= 0 || 
           c.id.toLowerCase().indexOf(q) >= 0 ||
           (c.numero && c.numero.indexOf(q) >= 0);
  }).slice(0, 20);
  
  if (filtrados.length === 0) {
    cont.innerHTML = '<div style="padding:12px; color:#94A3B8; text-align:center;">No se encontraron clientes</div>';
    cont.style.display = 'block';
    return;
  }
  
  let html = '';
  filtrados.forEach(function(c) {
    html += '<div class="cliente-item" onclick="seleccionarCliente(\'' + c.id + '\', \'' + c.nombre.replace(/'/g, "\\'") + '\')" style="padding:12px; border-bottom:1px solid #334155; cursor:pointer;">' + c.nombre + (c.direccion ? ' (' + c.direccion + ')' : '') + '</div>';
  });
  cont.innerHTML = html;
  cont.style.display = 'block';
}

function seleccionarCliente(id, nombre) {
  document.getElementById('cliente-input').value = nombre;
  document.getElementById('cliente').value = id;
  document.getElementById('cliente-resultados').style.display = 'none';
  guardarBorrador();
}

// Cerrar el dropdown al hacer clic fuera
document.addEventListener('click', function(e) {
  const input = document.getElementById('cliente-input');
  const cont = document.getElementById('cliente-resultados');
  if (input && cont && !input.contains(e.target) && !cont.contains(e.target)) {
    cont.style.display = 'none';
  }
});

function guardarBorrador() {
  localStorage.setItem('arqui_borrador_salida', JSON.stringify({
    documento: document.getElementById('documento').value,
    cliente: document.getElementById('cliente').value,
    clienteNombre: document.getElementById('cliente-input').value,
    lineas: lineasAgregadas
  }));
}

function limpiarTodo() {
  if(confirm('¿Seguro que quieres borrar la lista actual?')) {
    lineasAgregadas = [];
    document.getElementById('documento').value = '';
    localStorage.removeItem('arqui_borrador_salida');
    renderizarLineas();
  }
}

// --- 2. LECTURA IA ---
// --- PROCESAR FOTO CON RECORTE ---
let cropper = null;
let inputFotoActual = null;

async function procesarFotoIA(input) {
  const file = input.files[0];
  if (!file) return;
  
  inputFotoActual = input;
  
  // Mostrar modal de recorte
  const modal = document.getElementById('modal-recorte');
  const img = document.getElementById('imagen-a-recortar');
  
  const url = URL.createObjectURL(file);
  img.src = url;
  modal.style.display = 'flex';
  
  // Esperar a que la imagen cargue para inicializar cropper
  img.onload = function() {
    if (cropper) cropper.destroy();
    cropper = new Cropper(img, {
      viewMode: 1,
      autoCropArea: 0.9,
      background: false,
      responsive: true,
      guides: true,
      movable: true,
      zoomable: true,
      scalable: false,
      rotatable: false
    });
  };
}

function cancelarRecorte() {
  const modal = document.getElementById('modal-recorte');
  modal.style.display = 'none';
  if (cropper) { cropper.destroy(); cropper = null; }
  if (inputFotoActual) { inputFotoActual.value = ''; }
}

async function usarImagenCompleta() {
  const modal = document.getElementById('modal-recorte');
  const img = document.getElementById('imagen-a-recortar');
  
  modal.style.display = 'none';
  if (cropper) { cropper.destroy(); cropper = null; }
  
  // Enviar la imagen completa (sin recortar)
  await enviarFotoIA(img.src, true);
  if (inputFotoActual) { inputFotoActual.value = ''; }
}

async function aplicarRecorte() {
  if (!cropper) return;
  
  const modal = document.getElementById('modal-recorte');
  
  // Obtener el canvas recortado
  const canvasOriginal = cropper.getCroppedCanvas({
  maxWidth: 2400,
  maxHeight: 2400,
  imageSmoothingQuality: 'high'
});
  
  // Mejorar la imagen: aumentar contraste y brillo
  const canvasMejorado = document.createElement('canvas');
  canvasMejorado.width = canvasOriginal.width;
  canvasMejorado.height = canvasOriginal.height;
  const ctx = canvasMejorado.getContext('2d');
  
  // Filtro CSS de mejora
  ctx.filter = 'contrast(1.3) brightness(1.1) grayscale(0.2)';
  ctx.drawImage(canvasOriginal, 0, 0);
  
  const dataUrl = canvasMejorado.toDataURL('image/jpeg', 0.92);
  
  modal.style.display = 'none';
  if (cropper) { cropper.destroy(); cropper = null; }
  
  await enviarFotoIA(dataUrl, false);
  if (inputFotoActual) { inputFotoActual.value = ''; }
}

async function enviarFotoIA(dataUrl, esCompleta) {
  const botones = document.querySelectorAll('.btn-camara');
  botones.forEach(b => { b.disabled = true; });
  
  const estado = document.getElementById('estado');
  estado.className = 'ok';
  estado.textContent = (esCompleta ? 'Enviando imagen completa' : 'Enviando recorte') + ' a la IA... (puede tardar unos segundos)';
  estado.style.display = 'block';
  
  try {
    const r = await apiPost({ accion: 'escanear_ia', base64: dataUrl }, 90);
    
    if (!r.ok) throw new Error(r.error || 'No se pudo leer la factura');
    
    if (r.factura && document.getElementById('documento')) {
  document.getElementById('documento').value = r.factura;
}
    
    // Agregar líneas reconocidas
    (r.lineas || []).forEach(l => {
      const match = productos.find(p => p.id === l.id_producto);
      lineasAgregadas.push({
        id_producto: l.id_producto,
        nombre: l.nombre,
        unidad: match ? (match.unidad_base || l.unidad || 'Unidad') : (l.unidad || 'Unidad'),
        cantidad: l.cantidad,
        precio: l.precio || '',
        stock_sistema: match ? (match.stock_actual || 0) : 0
      });
    });
    
    // Pendientes (no reconocidos)
    (r.sin_coincidencia || []).forEach(nombreOriginal => {
      lineasAgregadas.push({
        id_producto: null,
        nombre: nombreOriginal,
        unidad: 'Pendiente',
        cantidad: 1,
        stock_sistema: 0
      });
    });
    
    if (typeof renderizarLineas === 'function') renderizarLineas();
    if (typeof guardarBorrador === 'function') guardarBorrador();
    
    let msg = 'Factura leída. Productos agregados: ' + (r.lineas || []).length + '.';
    if (r.sin_coincidencia && r.sin_coincidencia.length) {
      msg += '\n\nNo reconocí estos, agrégalos manualmente:\n- ' + r.sin_coincidencia.join('\n- ');
    }
    alert(msg);
    estado.style.display = 'none';
  } catch (err) {
    estado.className = 'error';
    estado.textContent = 'Error: ' + err.message;
  } finally {
    botones.forEach(b => { b.disabled = false; });
  }
}

// --- 3. BUSCADOR Y REEMPLAZO (LA MAGIA) ---
function abrirBuscador(index) {
  indexEditando = (typeof index === 'number') ? index : -1;
  document.getElementById('buscador-wrapper').style.display = 'block';
  document.getElementById('input-buscar').focus();
}

function abrirBuscadorParaReemplazar(index) {
  abrirBuscador(index);
}

function cerrarBuscador() {
  document.getElementById('buscador-wrapper').style.display = 'none';
  document.getElementById('input-buscar').value = '';
  document.getElementById('resultados-busqueda').innerHTML = '';
}

function filtrar() {
  const q = document.getElementById('input-buscar').value.toLowerCase();
  const cont = document.getElementById('resultados-busqueda');
  cont.innerHTML = '';
  if (q.length < 2) return;

  productos.filter(p => (p.id + ' ' + p.nombre).toLowerCase().includes(q)).slice(0, 10).forEach(p => {
    const d = document.createElement('div');
    d.className = 'resultado';
    d.innerHTML = `<strong>${p.nombre}</strong> <span style="color:var(--suave);font-size:12px;">(Stock: ${p.stock_actual})</span>`;
    d.onclick = () => seleccionarProducto(p);
    cont.appendChild(d);
  });
}

function seleccionarProducto(p) {
  cerrarBuscador();
  
  if (indexEditando === -1) {
    // Pedir cantidad
    const cant = prompt(`¿Cuántas unidades de ${p.nombre} se venden?`, '1');
    if (!cant || isNaN(cant)) return;
    
    // Pedir precio de venta
    const precioSugerido = p.precio_venta || '';
    const precio = prompt(
      `¿A qué precio de venta cada ${(p.unidad_base || 'Unidad').toLowerCase()} de ${p.nombre}?${precioSugerido ? '\n\n(Sugerido: $' + precioSugerido + ')' : ''}`,
      precioSugerido
    );
    if (precio === null) return;
    const precioNum = precio && !isNaN(precio) ? Number(precio) : '';
    
    lineasAgregadas.push({
      id_producto: p.id,
      nombre: p.nombre,
      unidad: p.unidad_base || 'Unidad',
      cantidad: Number(cant),
      precio: precioNum,
      stock_sistema: p.stock_actual
    });
  } else {
    // Reemplazar pendiente
    const anterior = lineasAgregadas[indexEditando];
    
    if (!anterior.id_producto) {
      const confirmarTexto = confirm(
        `La IA leyó: "${anterior.nombre}"\n\n` +
        `¿Es correcto este texto en la factura?\n\n` +
        `• Aceptar = Sí, es correcto\n` +
        `• Cancelar = No, era otro texto`
      );
      
      if (confirmarTexto) {
        apiPost({
          accion: 'guardar_alias',
          alias: anterior.nombre,
          id_producto: p.id
        }).then(r => console.log('✅ Alias guardado:', r));
      } else {
        const textoReal = prompt(
          `¿Cuál era el texto REAL en la factura?`,
          ''
        );
        if (textoReal && textoReal.trim()) {
          apiPost({
            accion: 'guardar_alias',
            alias: textoReal.trim(),
            id_producto: p.id
          }).then(r => console.log('✅ Alias correcto guardado:', r));
        }
      }
    }
    
    // Pedir cantidad
    const cant = prompt(`¿Cuántas unidades de ${p.nombre}?`, anterior.cantidad || 1);
    if (!cant || isNaN(cant)) return;
    
    // Pedir precio
    const precioSugerido = p.precio_venta || '';
    const precio = prompt(
      `¿A qué precio de venta cada ${(p.unidad_base || 'Unidad').toLowerCase()} de ${p.nombre}?${precioSugerido ? '\n\n(Sugerido: $' + precioSugerido + ')' : ''}`,
      precioSugerido
    );
    if (precio === null) return;
    const precioNum = precio && !isNaN(precio) ? Number(precio) : '';
    
    lineasAgregadas[indexEditando] = {
      id_producto: p.id,
      nombre: p.nombre,
      unidad: p.unidad_base || 'Unidad',
      cantidad: Number(cant),
      precio: precioNum,
      stock_sistema: p.stock_actual
    };
  }
  
  indexEditando = -1;
  renderizarLineas();
  guardarBorrador();
}
function agregarLinea(p) {
  cerrarBuscador();
  
  if (indexEditando === -1) {
    // Agregar nuevo manual
    const cant = prompt(`¿Cuántas unidades de ${p.nombre} llegaron?`);
    if (!cant || isNaN(cant)) return;
    lineasAgregadas.push({
      id_producto: p.id,
      nombre: p.nombre,
      unidad: p.unidad_base || 'Unidad',
      cantidad: Number(cant)
    });
  } else {
    // Reemplazar pendiente
    const anterior = lineasAgregadas[indexEditando];
    
    if (!anterior.id_producto) {
      // Preguntar si el texto que leyó la IA era correcto
      const confirmarTexto = confirm(
        `La IA leyó: "${anterior.nombre}"\n\n` +
        `¿Es correcto este texto en la factura?\n\n` +
        `• Aceptar = Sí, es correcto\n` +
        `• Cancelar = No, era otro texto`
      );
      
      if (confirmarTexto) {
        // Guardar el alias con el texto original
        apiPost({
          accion: 'guardar_alias',
          alias: anterior.nombre,
          id_producto: p.id
        }).then(r => console.log('✅ Alias guardado:', r));
      } else {
        // Preguntar el texto correcto
        const textoReal = prompt(
          `¿Cuál era el texto REAL en la factura? (escríbelo tal cual aparecía)`,
          ''
        );
        if (textoReal && textoReal.trim()) {
          apiPost({
            accion: 'guardar_alias',
            alias: textoReal.trim(),
            id_producto: p.id
          }).then(r => console.log('✅ Alias correcto guardado:', r));
        }
      }
    }
    
    const cant = prompt(`¿Cuántas unidades de ${p.nombre}?`, anterior.cantidad || 1);
    if (!cant || isNaN(cant)) return;
    
    lineasAgregadas[indexEditando] = {
      id_producto: p.id,
      nombre: p.nombre,
      unidad: p.unidad_base || 'Unidad',
      cantidad: Number(cant)
    };
  }
  
  indexEditando = -1;
  renderizarLineas();
}

// --- 4. RENDERIZADO ---
function renderizarLineas() {
  const cont = document.getElementById('lista-lineas');
  if (lineasAgregadas.length === 0) {
    cont.innerHTML = '<p style="text-align: center; color: var(--suave); font-size: 14px;">No hay productos agregados.</p>';
    return;
  }

  cont.innerHTML = '';
  lineasAgregadas.forEach((l, index) => {
    const div = document.createElement('div');
    div.className = 'linea';

    if (!l.id_producto) {
      // PENDIENTE: se puede tocar para asignar
      div.style.borderLeft = '4px solid #EF4444';
      div.style.paddingLeft = '12px';
      div.style.background = 'rgba(239, 68, 68, 0.05)';
      div.style.borderRadius = '4px';
      div.onclick = () => abrirBuscadorParaReemplazar(index);
      div.innerHTML = `
        <div class="linea-info">
          <h4 style="color:#EF4444;">${l.nombre} (No reconocido)</h4>
          <p>Toca aquí para asignarle un producto del catálogo</p>
        </div>
        <button class="btn-eliminar" onclick="event.stopPropagation(); eliminarLinea(${index})">×</button>
      `;
    } else {
      // RECONOCIDO
      let alerta = '';
      if (l.cantidad > l.stock_sistema) {
        alerta = `<span class="alerta-stock">⚠️ ¡No hay suficiente! (Stock: ${l.stock_sistema})</span>`;
      }
      const precioTexto = l.precio ? ' · $' + Number(l.precio).toLocaleString('es-CO') + ' c/u' : ' · Sin precio';
      div.onclick = () => editarLineaSalida(index);
      div.innerHTML = `
        <div class="linea-info">
          <h4>${l.nombre} <span class="badge-unidad">${l.unidad}</span></h4>
          <p>${l.cantidad} ${l.unidad.toLowerCase()}(s)${precioTexto}</p>
          ${alerta}
        </div>
        <button class="btn-eliminar" onclick="event.stopPropagation(); eliminarLinea(${index})">×</button>
      `;
    }
    cont.appendChild(div);
  });
}

function editarCantidad(index) {
  const actual = lineasAgregadas[index].cantidad;
  const nueva = prompt(`Editar cantidad de ${lineasAgregadas[index].nombre}:`, actual);
  if (nueva !== null && nueva !== '' && !isNaN(nueva)) {
    lineasAgregadas[index].cantidad = Number(nueva);
    renderizarLineas();
    guardarBorrador();
  }
}
function editarLineaSalida(index) {
  const l = lineasAgregadas[index];
  
  const nuevaCant = prompt(`Cantidad de ${l.nombre}:`, l.cantidad);
  if (nuevaCant === null || nuevaCant === '' || isNaN(nuevaCant)) return;
  
  const nuevoPrecio = prompt(
    `Precio de venta unitario de ${l.nombre}:\n\n(Deja vacío si no lo sabes)`,
    l.precio || ''
  );
  if (nuevoPrecio === null) return;
  
  lineasAgregadas[index].cantidad = Number(nuevaCant);
  lineasAgregadas[index].precio = nuevoPrecio && !isNaN(nuevoPrecio) ? Number(nuevoPrecio) : '';
  
  renderizarLineas();
  guardarBorrador();
}

function eliminarLinea(index) {
  lineasAgregadas.splice(index, 1);
  renderizarLineas();
  guardarBorrador();
}

// --- 5. GUARDAR SALIDA ---
async function guardarSalida() {
  const documento = document.getElementById('documento').value.trim();
  const cliente = document.getElementById('cliente').value;

  if (!documento) return alert('Escribe el número de factura');
  
  const hayPendientes = lineasAgregadas.some(l => !l.id_producto);
  if (hayPendientes) return alert('Tienes productos "No reconocidos" en rojo. Tócalos y asígnalos a tu catálogo antes de guardar.');

  if (lineasAgregadas.length === 0) return alert('Agrega al menos un producto');

  const excede = lineasAgregadas.find(l => l.cantidad > l.stock_sistema);
  if (excede) {
    if(!confirm(`Atención: Estás sacando más ${excede.nombre} del que hay en stock.\n¿Deseas continuar?`)) return;
  }

  const btn = document.getElementById('btn-guardar');
  btn.textContent = 'Guardando...';
  btn.disabled = true;

  const datos = {
    documento: documento,
    cliente: document.getElementById('cliente').value,
    fecha: new Date().toISOString().split('T')[0],
    lineas: lineasAgregadas
  };

  try {
    const r = await apiPost({ accion: 'guardar_salida', datos: datos });

    if (r.ok) {
      let mensaje = '¡Salida guardada con éxito!\nID: ' + r.id_salida + '\nLíneas: ' + (r.lineas || 0);
      
      // Alertas de stock bajo
      if (r.alertas_stock_bajo && r.alertas_stock_bajo.length > 0) {
        mensaje += '\n\n⚠️ ¡ATENCIÓN! Productos con stock bajo:';
        r.alertas_stock_bajo.forEach(function(a) {
          mensaje += '\n\n📦 ' + a.nombre;
          mensaje += '\n   • Stock actual: ' + a.stock_actual + ' ' + a.unidad.toLowerCase() + '(s)';
          mensaje += '\n   • Stock mínimo: ' + a.stock_minimo;
          mensaje += '\n\n👉 Considera reabastecer este producto.';
        });
      }
      
      alert(mensaje);
      localStorage.removeItem('arqui_borrador_salida');
      
      // Actualizar badge del búho si estamos en la misma ventana
      if (typeof actualizarBadgeRecordatorios === 'function') {
        actualizarBadgeRecordatorios();
      }
      
      // Redirigir al menú principal para que se actualice el badge
      window.location.href = 'index.html';
    } else {
      alert('❌ Error del backend:\n' + r.error);
    }
  } catch (err) {
    alert('❌ Error de conexión:\n' + err.message);
  } finally {
    btn.textContent = 'Guardar Salida';
    btn.disabled = false;
  }
}


// --- MÓDULO DE VOZ: DICTADO POR MICRÓFONO ---
let reconocimientoVoz = null;
let dictadoActivo = false;
let textoCapturado = '';

function iniciarDictado() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('Tu navegador no soporta dictado por voz. Usa Chrome.');
    return;
  }

  const btn = document.getElementById('btn-microfono');
  const estado = document.getElementById('estado');

  if (dictadoActivo && reconocimientoVoz) {
    reconocimientoVoz.stop();
    return;
  }

  textoCapturado = '';
  reconocimientoVoz = new SpeechRecognition();
  reconocimientoVoz.lang = 'es-CO';
  reconocimientoVoz.continuous = false;
  reconocimientoVoz.interimResults = false;
  reconocimientoVoz.maxAlternatives = 1;

  reconocimientoVoz.onstart = function() {
    dictadoActivo = true;
    btn.style.background = '#EF4444';
    btn.textContent = '⏹️';
    estado.className = 'ok';
    estado.textContent = '🎤 Escuchando... Habla claro y espera.';
    estado.style.display = 'block';
  };

  reconocimientoVoz.onresult = function(event) {
    if (event.results && event.results[0] && event.results[0][0]) {
      textoCapturado = event.results[0][0].transcript || '';
      estado.textContent = '📝 Capturado: "' + textoCapturado + '"';
    }
  };

  reconocimientoVoz.onerror = function(event) {
    dictadoActivo = false;
    btn.style.background = '';
    btn.textContent = '🎤';
    estado.className = 'error';
    estado.textContent = 'Error de micrófono: ' + event.error;
  };

  reconocimientoVoz.onend = async function() {
    dictadoActivo = false;
    btn.style.background = '';
    btn.textContent = '🎤';

    if (!textoCapturado || textoCapturado.trim() === '') {
      estado.className = 'error';
      estado.textContent = '⚠️ No se captó audio. Intenta de nuevo.';
      return;
    }

    estado.className = 'ok';
    estado.textContent = '📝 Dijiste: "' + textoCapturado + '"\nProcesando...';

    try {
      // En salidas NO hay selector de proveedor; usamos genérico
      const r = await apiPost({
        accion: 'parsear_texto',
        texto: textoCapturado,
        id_proveedor: '' // vacío = usar todos los alias
      }, 60);

      if (!r.ok) throw new Error(r.error || 'No se pudo interpretar');

      (r.lineas || []).forEach(l => {
  const match = productos.find(p => p.id === l.id_producto);
  lineasAgregadas.push({
    id_producto: l.id_producto,
    nombre: l.nombre,
    unidad: match ? (match.unidad_base || l.unidad || 'Unidad') : (l.unidad || 'Unidad'),
    cantidad: l.cantidad,
    precio: l.precio || '',
    stock_sistema: match ? (match.stock_actual || 0) : 0  // <-- AGREGAR
  });
});

      renderizarLineas();
      guardarBorrador();

      let msg = '📝 Tú dijiste: "' + (r.texto_recibido || textoCapturado) + '"\n\n';
      msg += '🤖 Gemini entendió:\n';
      (r.gemini_dijo && r.gemini_dijo.lineas ? r.gemini_dijo.lineas : []).forEach(function(l) {
        msg += '  • ' + l.descripcion + ' (' + l.cantidad + ' ' + l.unidad + ')\n';
      });
      msg += '\n🔍 Resultado:\n';
      (r.diagnostico || []).forEach(function(d) { msg += '  ' + d + '\n'; });
      msg += '\n✅ Se agregaron ' + (r.lineas || []).length + ' producto(s).';
      alert(msg);
      estado.style.display = 'none';
    } catch (err) {
      estado.className = 'error';
      estado.textContent = 'Error: ' + err.message;
    }
  };

  reconocimientoVoz.start();
}
// --- AVISO AL VOLVER CON DATOS SIN GUARDAR ---
function confirmarVolverSalida() {
  const hayLineas = (typeof lineasAgregadas !== 'undefined') && lineasAgregadas.length > 0;
  const documento = document.getElementById('documento');
  const hayDocumento = documento && documento.value.trim() !== '';
  
  if (hayLineas || hayDocumento) {
    const salir = confirm('⚠️ Tienes datos sin guardar en esta salida.\n\n¿Deseas salir sin guardar?');
    if (!salir) {
      return false;
    }
    localStorage.removeItem('arqui_borrador_salida');
  }
  return true;
}

// --- BOTÓN PARA LIMPIAR LISTA (opcional) ---
function limpiarSalida() {
  if (lineasAgregadas.length === 0 && !document.getElementById('documento').value) {
    return alert('No hay datos para limpiar.');
  }
  if (confirm('¿Seguro que quieres borrar todos los productos de la lista?\n\nEsta acción no se puede deshacer.')) {
    lineasAgregadas = [];
    document.getElementById('documento').value = '';
    localStorage.removeItem('arqui_borrador_salida');
    renderizarLineas();
    guardarBorrador();
    alert('✅ Lista limpiada. Puedes empezar de nuevo.');
  }
}
// ============================================
// NUEVO CLIENTE
// ============================================
function abrirNuevoCliente() {
  document.getElementById('nc-nombre').value = '';
  document.getElementById('nc-apellido').value = '';
  document.getElementById('nc-numero').value = '';
  document.getElementById('nc-direccion').value = '';
  document.getElementById('modal-nuevo-cli').classList.add('open');
  setTimeout(() => document.getElementById('nc-nombre').focus(), 100);
}

function cerrarNuevoCliente() {
  document.getElementById('modal-nuevo-cli').classList.remove('open');
}

async function guardarNuevoCliente() {
  const nombre = document.getElementById('nc-nombre').value.trim();
  if (!nombre) {
    alert('Escribe el nombre del cliente');
    document.getElementById('nc-nombre').focus();
    return;
  }

  const datos = {
    nombre: nombre,
    apellido: document.getElementById('nc-apellido').value.trim(),
    numero: document.getElementById('nc-numero').value.trim(),
    direccion: document.getElementById('nc-direccion').value.trim()
  };

  const btn = document.getElementById('nc-btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    const r = await apiPost({ accion: 'crear_cliente', datos: datos }, 30);
    if (!r.ok) throw new Error(r.error || 'No se pudo crear el cliente');

    cerrarNuevoCliente();

    // Recargar la lista de clientes en memoria
    try {
      const inv = await apiGet('accion=clientes');
      if (inv.ok) {
        clientesCache = inv.items || [];
      }
    } catch (e) { console.error('Error recargando clientes:', e); }

    // Seleccionar automáticamente el cliente recién creado
    document.getElementById('cliente-input').value = r.nombre_completo;
    document.getElementById('cliente').value = r.id_cliente;
    guardarBorrador();

    alert('✅ Cliente creado: ' + r.nombre_completo + '\nID: ' + r.id_cliente);
  } catch (err) {
    alert('❌ ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
}
