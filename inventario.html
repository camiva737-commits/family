<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inventario · Distribuidora TAT</title>
<script src="auth.js"></script>
<script src="comun.js?v=11"></script>
<link rel="stylesheet" href="tema.css">
<style>
  .toggle { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--borde); box-shadow: var(--shadow-1); }
  .toggle button { flex: 1; padding: 12px; border: none; border-radius: 10px; background: transparent; color: var(--suave); font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; font-family: inherit; }
  .toggle button.active { background: var(--acento); color: #FFF; box-shadow: 0 2px 8px rgba(242, 140, 0, 0.3); }
  .btn-nuevo-prod { width: 100%; padding: 14px; border-radius: var(--radius-input); border: 1px dashed var(--acento); background: transparent; color: var(--acento); font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 16px; transition: 0.15s; font-family: inherit; }
  .btn-nuevo-prod:hover { background: var(--acento-suave); }
  .btn-nuevo-prod:active { transform: scale(0.98); }
  .prod-card { background: var(--card); padding: 14px 16px; border-radius: 14px; margin-bottom: 10px; display: flex; gap: 14px; align-items: center; border: 1px solid var(--borde); cursor: pointer; box-shadow: var(--shadow-1); transition: 0.15s; }
  .prod-card:hover { transform: translateX(2px); box-shadow: var(--shadow-2); }
  .prod-card:active { transform: scale(0.99); }
  .prod-foto { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: var(--input); flex-shrink: 0; }
  .prod-inicial { width: 48px; height: 48px; border-radius: 12px; background: var(--acento-suave); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--acento); font-weight: 800; flex-shrink: 0; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-info h3 { font-size: 15px; font-weight: 700; color: var(--texto); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prod-info p { font-size: 12px; color: var(--suave); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .stock-positivo { color: var(--ok); font-weight: 700; font-size: 14px; }
  .stock-cero { color: var(--peligro); font-weight: 700; font-size: 14px; }
  .stock-negativo { color: var(--peligro); font-weight: 800; font-size: 14px; }
  .stock-gris { color: var(--suave); font-weight: 600; font-size: 14px; }
  #panel { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--borde); display: none; margin-top: 16px; box-shadow: var(--shadow-2); }
  #panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .stock-actual-info { background: var(--acento-suave); padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; border-left: 3px solid var(--acento); }
  .stock-actual-info-lbl { font-size: 11px; font-weight: 700; color: var(--primario); letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 4px; }
  .stock-actual-info-val { font-size: 22px; font-weight: 800; color: var(--acento); }
  .modal-prod { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-prod.open { display: flex; }
  .modal-prod-content { background: var(--card); border-radius: 18px; max-width: 500px; width: 100%; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid var(--borde); box-shadow: var(--shadow-3); }
  .modal-prod-header { padding: 16px; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: center; background: var(--input); border-radius: 18px 18px 0 0; }
  .modal-prod-header h3 { font-size: 16px; font-weight: 700; color: var(--texto); margin: 0; }
  .modal-prod-header button { background: none; border: none; color: var(--suave); font-size: 22px; cursor: pointer; line-height: 1; }
  .modal-prod-body { padding: 16px; overflow-y: auto; }
  .modal-prod-body label { display: block; font-size: 12px; color: var(--suave); margin-bottom: 6px; font-weight: 700; letter-spacing: 0.02em; margin-top: 12px; }
  .modal-prod-body label:first-child { margin-top: 0; }
  .modal-prod-body input, .modal-prod-body select { margin-bottom: 0; }
  .modal-prod-footer { padding: 12px 16px; border-top: 1px solid var(--borde); display: flex; gap: 10px; background: var(--input); border-radius: 0 0 18px 18px; }
  .modal-prod-footer button { flex: 1; padding: 14px; border-radius: var(--radius-input); border: none; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-cancelar-modal { background: var(--card); color: var(--suave); border: 1px solid var(--borde); }
  .btn-guardar-modal { background: var(--acento-2); color: #FFF; }
  .btn-guardar-modal:hover { background: var(--acento); }
  .btn-guardar-modal:disabled { opacity: 0.5; cursor: not-allowed; }
  .contador { text-align: center; color: var(--suave); font-size: 12px; font-weight: 600; margin: 12px 0; }
</style>
</head>
<body>

  <div class="page-header">
    <div class="page-header-left">
      <h1 style="color: var(--acento); margin: 0;">Inventario</h1>
      <p class="subtitulo">Stock y ajustes</p>
    </div>
    <div class="page-header-right">
      <button class="icon-btn" id="btn-tema" onclick="Tema.cambiar()" title="Cambiar tema">🌙</button>
      <button class="icon-btn" onclick="if(confirmarVolverInventario()) window.location.href='index.html'" title="Volver">←</button>
    </div>
  </div>

  <div id="estado" style="display: none;"></div>

  <div class="toggle">
    <button id="btn-inicial" class="active" onclick="cambiarModo('inicial')">Conteo Inicial</button>
    <button id="btn-ajuste" onclick="cambiarModo('ajuste')">Ajuste de Stock</button>
  </div>

  <button class="btn-nuevo-prod" onclick="abrirNuevoProducto()">+ Nuevo producto</button>

  <input type="text" id="buscar" placeholder="🔍 Buscar producto..." autocomplete="off" oninput="filtrar()" class="search-bar">

  <div id="lista"></div>

  <div id="panel">
    <h2 id="p-nombre">Producto</h2>
    <div class="stock-actual-info">
      <div class="stock-actual-info-lbl">Stock actual</div>
      <div class="stock-actual-info-val" id="p-stock">0</div>
    </div>
    
    <input type="number" id="conteo" placeholder="Conteo real">
    
    <div id="div-motivo" style="display: none;">
      <select id="motivo">
        <option value="Venta no registrada">Venta no registrada</option>
        <option value="Consumo interno">Consumo interno</option>
        <option value="Error de conteo">Error de conteo</option>
      </select>
    </div>

    <button class="btn-primario" id="btn-guardar" onclick="guardarCambios()">Guardar Cambios</button>
  </div>

  <div id="modal-nuevo-prod" class="modal-prod" onclick="if(event.target.id==='modal-nuevo-prod')cerrarNuevoProducto()">
    <div class="modal-prod-content">
      <div class="modal-prod-header">
        <h3>Nuevo producto</h3>
        <button onclick="cerrarNuevoProducto()">×</button>
      </div>
      <div class="modal-prod-body">
        <label>Nombre *</label>
        <input type="text" id="np-nombre" placeholder="Ej: Gol Surtido 50g">
        <label>Categoría</label>
        <input type="text" id="np-categoria" placeholder="Ej: Dulces" value="General">
        <label>Precio de venta</label>
        <input type="number" id="np-precio" placeholder="0" value="0" min="0" step="0.01">
        <label>Unidad base *</label>
        <input type="text" id="np-unidad" placeholder="Unidad, Caja, Paquete..." value="Unidad">
        <label>Factor (cuántas unidades base vienen en una presentación)</label>
        <input type="number" id="np-factor" placeholder="1" value="1" min="1">
        <label>Stock mínimo (para alertas)</label>
        <input type="number" id="np-stock-min" placeholder="2" value="2" min="0">
        <label>Código de barras (opcional)</label>
        <input type="text" id="np-codigo" placeholder="Ej: 7701234567890">
        <label>¿Controla vencimiento?</label>
        <select id="np-controla-venc">
          <option value="No">No</option>
          <option value="Si">Sí</option>
        </select>
      </div>
      <div class="modal-prod-footer">
        <button class="btn-cancelar-modal" onclick="cerrarNuevoProducto()">Cancelar</button>
        <button class="btn-guardar-modal" id="np-btn-guardar" onclick="guardarNuevoProducto()">Guardar</button>
      </div>
    </div>
  </div>

<script>
let productos = [];
let elegido = null;
let modo = 'inicial';

(async function () {
  mostrarMensaje('Cargando productos...', 'aviso');
  try {
    const r = await apiGet('accion=inventario');
    if (!r.ok) throw new Error(r.error);
    productos = r.items;
    mostrarMensaje('¡Catálogo cargado!', 'ok');
    setTimeout(() => { document.getElementById('estado').style.display = 'none'; }, 3000);
    filtrar();
  } catch (err) {
    mostrarMensaje('Error de conexión: ' + err.message, 'error');
  }
})();

function mostrarMensaje(msg, tipo) {
  const el = document.getElementById('estado');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.padding = '14px';
  el.style.borderRadius = '12px';
  el.style.textAlign = 'center';
  el.style.fontWeight = '700';
  el.style.fontSize = '14px';
  el.style.marginBottom = '16px';
  
  if (tipo === 'ok') {
    el.style.background = 'var(--ok-bg)';
    el.style.color = 'var(--ok)';
    el.style.border = '1px solid var(--ok)';
  } else if (tipo === 'error') {
    el.style.background = 'var(--peligro-bg)';
    el.style.color = 'var(--peligro)';
    el.style.border = '1px solid var(--peligro)';
  } else {
    el.style.background = 'var(--warning-bg)';
    el.style.color = 'var(--warning)';
    el.style.border = '1px solid var(--warning)';
  }
}

function filtrar() {
  const q = document.getElementById('buscar').value.toLowerCase().trim();
  const cont = document.getElementById('lista');
  cont.innerHTML = '';

  let resultados = productos;
  if (q.length > 0) {
    resultados = productos.filter(p => (p.id + ' ' + p.nombre).toLowerCase().includes(q));
  }

  resultados.sort((a, b) => {
    const stockA = a.stock_actual || 0;
    const stockB = b.stock_actual || 0;
    if (stockA > 0 && stockB > 0) return stockB - stockA;
    if (stockA <= 0 && stockB <= 0) return a.nombre.localeCompare(b.nombre);
    return stockB - stockA;
  });

  if (resultados.length > 0) {
    const contador = document.createElement('div');
    contador.className = 'contador';
    contador.textContent = 'Mostrando ' + resultados.length + ' producto(s)';
    cont.appendChild(contador);
  }

  resultados.forEach(p => {
    const d = document.createElement('div');
    d.className = 'prod-card';
    
    let foto = p.imagen_url 
      ? `<img src="${p.imagen_url}" class="prod-foto">` 
      : `<div class="prod-inicial">${p.nombre.charAt(0)}</div>`;

    let claseStock = 'stock-gris';
    if (p.stock_actual > 0) claseStock = 'stock-positivo';
    else if (p.stock_actual === 0) claseStock = 'stock-cero';
    else if (p.stock_actual < 0) claseStock = 'stock-negativo';

    d.innerHTML = `${foto}
      <div class="prod-info">
        <h3>${p.nombre}</h3>
        <p>${p.id} · Stock: <span class="${claseStock}">${p.stock_actual}</span> ${p.unidad_base || ''}</p>
      </div>`;

    d.onclick = () => {
      elegido = p;
      document.getElementById('panel').style.display = 'block';
      document.getElementById('p-nombre').textContent = p.nombre;
      document.getElementById('p-stock').textContent = p.stock_actual;
      document.getElementById('conteo').value = '';
      cont.innerHTML = '';
      document.getElementById('buscar').value = '';
      document.getElementById('panel').scrollIntoView({ behavior: 'smooth' });
    };
    cont.appendChild(d);
  });

  if (resultados.length === 0) {
    cont.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">No se encontraron productos.</div></div>';
  }
}

async function guardarCambios() {
  if (!elegido) return;
  const cant = Number(document.getElementById('conteo').value);
  if (isNaN(cant)) return mostrarMensaje('Escribe un número válido', 'error');

  document.getElementById('btn-guardar').textContent = 'Guardando...';
  document.getElementById('btn-guardar').disabled = true;

  try {
    let r;
    if (modo === 'inicial') {
      r = await apiGet('accion=inventario_inicial&id_producto=' + elegido.id + '&conteo=' + cant);
    } else {
      const mot = document.getElementById('motivo').value;
      r = await apiGet('accion=ajuste_inventario&id_producto=' + elegido.id + '&conteo_real=' + cant + '&motivo=' + encodeURIComponent(mot));
    }

    if (r.ok) {
      mostrarMensaje('✅ Guardado exitosamente', 'ok');
      elegido.stock_actual = (modo === 'inicial') ? r.stock_inicial : r.stock_nuevo;
      document.getElementById('panel').style.display = 'none';
      filtrar();
      setTimeout(() => { document.getElementById('estado').style.display = 'none'; }, 3000);
    } else {
      mostrarMensaje('❌ ' + (r.error || 'Error al guardar'), 'error');
    }
  } catch (err) {
    mostrarMensaje('❌ Error de conexión', 'error');
  } finally {
    document.getElementById('btn-guardar').textContent = 'Guardar Cambios';
    document.getElementById('btn-guardar').disabled = false;
  }
}

function confirmarVolverInventario() {
  const panel = document.getElementById('panel');
  const panelAbierto = panel && panel.style.display === 'block';
  const conteo = document.getElementById('conteo');
  const hayConteo = conteo && conteo.value.trim() !== '';
  
  if (panelAbierto && hayConteo) {
    const salir = confirm('⚠️ Tienes un conteo sin guardar.\n\n¿Deseas salir sin guardar?');
    if (!salir) return false;
  }
  return true;
}

function cambiarModo(m) {
  modo = m;
  document.getElementById('btn-inicial').className = (m === 'inicial') ? 'active' : '';
  document.getElementById('btn-ajuste').className = (m === 'ajuste') ? 'active' : '';
  document.getElementById('div-motivo').style.display = (m === 'ajuste') ? 'block' : 'none';
  document.getElementById('conteo').value = '';
}

function abrirNuevoProducto() {
  document.getElementById('np-nombre').value = '';
  document.getElementById('np-categoria').value = 'General';
  document.getElementById('np-precio').value = '0';
  document.getElementById('np-unidad').value = 'Unidad';
  document.getElementById('np-factor').value = '1';
  document.getElementById('np-stock-min').value = '2';
  document.getElementById('np-codigo').value = '';
  document.getElementById('np-controla-venc').value = 'No';
  document.getElementById('modal-nuevo-prod').classList.add('open');
  setTimeout(() => document.getElementById('np-nombre').focus(), 100);
}

function cerrarNuevoProducto() {
  document.getElementById('modal-nuevo-prod').classList.remove('open');
}

async function guardarNuevoProducto() {
  const nombre = document.getElementById('np-nombre').value.trim();
  if (!nombre) {
    mostrarMensaje('Escribe el nombre del producto', 'error');
    document.getElementById('np-nombre').focus();
    return;
  }

  const datos = {
    nombre: nombre,
    categoria: document.getElementById('np-categoria').value.trim() || 'General',
    precio_venta: Number(document.getElementById('np-precio').value) || 0,
    unidad_base: document.getElementById('np-unidad').value.trim() || 'Unidad',
    factor_default: Number(document.getElementById('np-factor').value) || 1,
    stock_minimo: Number(document.getElementById('np-stock-min').value) || 2,
    codigo_barras: document.getElementById('np-codigo').value.trim(),
    controla_vencimiento: document.getElementById('np-controla-venc').value
  };

  const btn = document.getElementById('np-btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    const r = await apiPost({ accion: 'crear_producto', datos: datos }, 30);
    if (!r.ok) throw new Error(r.error || 'No se pudo crear el producto');

    cerrarNuevoProducto();
    mostrarMensaje('✅ Producto creado: ' + r.nombre + ' (' + r.id_producto + ')', 'ok');

    const inv = await apiGet('accion=inventario');
    if (inv.ok) {
      productos = inv.items;
      filtrar();
    }
  } catch (err) {
    mostrarMensaje('❌ ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
}
</script>
</body>
</html>
