<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inventario · ArquiDulces</title>
<link rel="stylesheet" href="estilos.css">
<!-- AQUÍ SE CONECTA CON EL COMUN.JS -->
<script src="comun.js"></script> 
<style>
  :root {
    --bg-app: #0F111A;
    --bg-card: #1A1D2D;
    --bg-input: #25293D;
    --texto: #F8FAFC;
    --texto-suave: #94A3B8;
    --borde: #334155;
    --acento: #F59E0B;
    --acento-bg: rgba(245, 158, 11, 0.15);
    --peligro: #EF4444;
    --exito: #10B981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg-app); color: var(--texto); padding: 20px; }
  
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-top: 10px; }
  .header-top h1 { font-size: 28px; font-weight: 800; color: var(--acento); letter-spacing: -0.5px; }
  
  .toggle-container { background: var(--bg-card); padding: 6px; border-radius: 16px; display: flex; gap: 6px; margin-bottom: 24px; border: 1px solid var(--borde); }
  .toggle-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 700; font-size: 14px; background: transparent; color: var(--texto-suave); cursor: pointer; transition: all 0.2s; }
  .toggle-btn.active { background: var(--acento); color: #000; box-shadow: 0 4px 12px var(--acento-bg); }

  .input-group { margin-bottom: 20px; }
  .input-group label { display: block; font-size: 13px; font-weight: 700; color: var(--texto-suave); margin-bottom: 8px; text-transform: uppercase; }
  input[type="text"], input[type="number"], select { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--borde); background: var(--bg-input); color: var(--texto); font-size: 16px; outline: none; }
  
  #resultados { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .card-producto { background: var(--bg-card); padding: 16px; border-radius: 20px; display: flex; align-items: center; gap: 16px; border: 1px solid var(--borde); cursor: pointer; }
  .card-producto:active { transform: scale(0.98); }
  
  .foto-producto { width: 56px; height: 56px; border-radius: 14px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: var(--acento); flex-shrink: 0; overflow: hidden; }
  .foto-producto img { width: 100%; height: 100%; object-fit: cover; }

  .info-producto { flex: 1; min-width: 0; }
  .nombre-producto { font-size: 16px; font-weight: 700; }
  .meta-producto { font-size: 13px; color: var(--texto-suave); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .badge-stock { padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 13px; }
  .badge-ok { background: rgba(16, 185, 129, 0.2); color: var(--exito); }
  .badge-cero { background: rgba(239, 68, 68, 0.2); color: var(--peligro); }

  .panel-edicion { background: var(--bg-card); padding: 24px; border-radius: 20px; border: 1px solid var(--borde); margin-top: 24px; display: none; }
  .btn-primario { width: 100%; padding: 18px; border-radius: 16px; border: none; background: var(--acento); color: #000; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 24px; }

  #estado { padding: 16px; border-radius: 16px; font-weight: 600; font-size: 14px; text-align: center; margin-bottom: 20px; display: none; }
  .estado-ok { background: rgba(16, 185, 129, 0.15); color: var(--exito); border: 1px solid var(--exito); }
  .estado-error { background: rgba(239, 68, 68, 0.15); color: var(--peligro); border: 1px solid var(--peligro); }
  .estado-aviso { background: var(--acento-bg); color: var(--acento); border: 1px solid var(--acento); }
</style>
</head>
<body>

<header class="header-top">
  <div>
    <h1>Inventario</h1>
  </div>
</header>

<div id="estado" class="estado-aviso" style="display: block;">Conectando con Google Sheets...</div>

<div class="toggle-container">
  <button id="modoInicial" class="toggle-btn active">Conteo Inicial</button>
  <button id="modoAjuste" class="toggle-btn">Ajuste de Stock</button>
</div>

<div class="input-group">
  <label>Buscar Producto</label>
  <input type="text" id="buscar" placeholder="Escribe 2 letras o más..." autocomplete="off">
</div>

<div id="resultados"></div>

<div class="panel-edicion" id="panel">
  <h2 id="infoNombre">Producto</h2>
  <div style="margin-bottom: 24px;">Stock actual: <strong id="infoStock" style="font-size: 20px; color: var(--acento);">0</strong></div>
  
  <div class="input-group">
    <label>Conteo Físico Real</label>
    <input type="number" id="conteo" min="0" step="1" placeholder="Ej: 12">
  </div>

  <div class="input-group" id="bloqueMotivo" style="display:none;">
    <label>Motivo del Ajuste</label>
    <select id="motivo">
      <option value="">Elige el motivo...</option>
      <option value="Venta no registrada">Venta no registrada</option>
      <option value="Consumo interno">Consumo interno</option>
      <option value="Error del sistema">Error del sistema</option>
    </select>
  </div>

  <button class="btn-primario" id="btnGuardar">Guardar Cambios</button>
</div>

<script>
let productos = [];
let elegido = null;
let modo = 'inicial';

// --- CARGA INICIAL ---
(async function () {
  mostrar('Cargando productos...', 'aviso');
  try {
    // Llamamos a la función del comun.js
    const r = await apiGet({ accion: 'inventario' });
    if (!r.ok) throw new Error(r.error);
    productos = r.items;
    mostrar('¡Catálogo cargado! Busca un producto.', 'ok');
    setTimeout(() => { document.getElementById('estado').style.display = 'none'; }, 3000);
  } catch (err) {
    mostrar('ERROR al conectar: ' + err.message, 'error');
  }
})();

function norm(s) { return String(s || '').toLowerCase().trim(); }

document.getElementById('buscar').addEventListener('input', function() {
  const q = norm(this.value);
  const cont = document.getElementById('resultados');
  cont.innerHTML = '';
  if (q.length < 2) return;

  const items = productos.filter(p => norm(p.id + ' ' + p.nombre).indexOf(q) >= 0).slice(0, 15);

  if (items.length === 0) {
    cont.innerHTML = '<div style="text-align:center; padding:20px; color:var(--texto-suave);">Producto no encontrado.</div>';
    return;
  }

  items.forEach(p => {
    const d = document.createElement('div');
    d.className = 'card-producto';
    d.innerHTML = `
      <div class="foto-producto">${p.nombre.charAt(0)}</div>
      <div class="info-producto">
        <div class="nombre-producto">${p.nombre}</div>
        <div class="meta-producto"><span>${p.id}</span> <span class="badge-stock badge-cero">${p.stock_actual} und</span></div>
      </div>
    `;
    d.addEventListener('click', () => {
      elegido = p;
      document.getElementById('panel').style.display = 'block';
      document.getElementById('infoNombre').textContent = p.nombre;
      document.getElementById('infoStock').textContent = p.stock_actual;
      cont.innerHTML = '';
      document.getElementById('buscar').value = '';
      document.getElementById('panel').scrollIntoView({ behavior: 'smooth' });
    });
    cont.appendChild(d);
  });
});

// (El resto de la lógica de botones de guardar sigue igual...)
</script>
</body>
</html>
