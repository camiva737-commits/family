<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inventario · Distribuidora TAT</title>
<script src="comun.js?v=6"></script>
<style>
  :root {
    --bg: #0F111A; --card: #1A1D2D; --input: #25293D; --texto: #F8FAFC; 
    --suave: #94A3B8; --borde: #334155; --acento: #F59E0B; --peligro: #EF4444; --exito: #10B981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--texto); padding: 20px; padding-bottom: 50px; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 { font-size: 24px; color: var(--acento); font-weight: 800; }
  .btn-volver { background: none; border: none; color: var(--suave); font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; }

  #estado { padding: 14px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 16px; display: none; }
  .ok { background: rgba(16, 185, 129, 0.2); color: var(--exito); border: 1px solid var(--exito); }
  .error { background: rgba(239, 68, 68, 0.2); color: var(--peligro); border: 1px solid var(--peligro); }
  .aviso { background: rgba(245, 158, 11, 0.2); color: var(--acento); border: 1px solid var(--acento); }

  .toggle { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 20px; border: 1px solid var(--borde); }
  .toggle button { flex: 1; padding: 12px; border: none; border-radius: 10px; background: transparent; color: var(--suave); font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
  .toggle button.active { background: var(--acento); color: #000; }

  input[type="text"], input[type="number"], select { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--borde); background: var(--input); color: var(--texto); font-size: 16px; margin-bottom: 16px; outline: none; }
  
  .card { background: var(--card); padding: 16px; border-radius: 16px; margin-bottom: 12px; display: flex; gap: 16px; align-items: center; border: 1px solid var(--borde); cursor: pointer; }
  .card img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; background: var(--input); }
  .card .inicial { width: 50px; height: 50px; border-radius: 10px; background: var(--input); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--acento); font-weight: bold; }
  .card-info h3 { font-size: 16px; }
  .card-info p { font-size: 13px; color: var(--suave); margin-top: 4px; }

  #panel { background: var(--card); padding: 24px; border-radius: 20px; border: 1px solid var(--borde); display: none; margin-top: 20px; }
  .btn-primario { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--acento); color: #000; font-size: 16px; font-weight: 800; cursor: pointer; }
    /* Botón "+ Nuevo producto" */
  .btn-nuevo-prod { width: 100%; padding: 14px; border-radius: 14px; border: 1px dashed var(--acento); background: transparent; color: var(--acento); font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 16px; }
  .btn-nuevo-prod:active { background: rgba(245, 158, 11, 0.1); }

  /* Modal de nuevo producto */
  .modal-prod { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-prod.open { display: flex; }
  .modal-prod-content { background: var(--card); border-radius: 18px; max-width: 500px; width: 100%; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid var(--borde); }
  .modal-prod-header { padding: 16px; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: center; }
  .modal-prod-body { padding: 16px; overflow-y: auto; }
  .modal-prod-body label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 6px; font-weight: bold; margin-top: 12px; }
  .modal-prod-body label:first-child { margin-top: 0; }
  .modal-prod-body input, .modal-prod-body select { margin-bottom: 0; }
  .modal-prod-footer { padding: 12px 16px; border-top: 1px solid var(--borde); display: flex; gap: 10px; }
  .modal-prod-footer button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; }
  .btn-cancelar-modal { background: var(--input); color: var(--suave); }
  .btn-guardar-modal { background: var(--acento); color: #000; }
  .btn-guardar-modal:disabled { opacity: 0.5; }
</style>
</head>
<body>

  <div class="header">
    <h1>Inventario</h1>
    <a href="index.html" class="btn-volver" onclick="return confirmarVolverInventario()">← Volver</a>
  </div>

  <div id="estado" class="aviso" style="display: block;">Conectando con Google Sheets...</div>

  <div class="toggle">
    <button id="btn-inicial" class="active" onclick="cambiarModo('inicial')">Conteo Inicial</button>
    <button id="btn-ajuste" onclick="cambiarModo('ajuste')">Ajuste de Stock</button>
  </div>

    <button class="btn-nuevo-prod" onclick="abrirNuevoProducto()">+ Nuevo producto</button>

  <input type="text" id="buscar" placeholder="Buscar producto..." autocomplete="off" oninput="filtrar()">

  <div id="lista"></div>

  <div id="panel">
    <h2 id="p-nombre" style="margin-bottom: 8px;">Producto</h2>
    <p style="margin-bottom: 20px; color: var(--suave);">Stock actual: <strong id="p-stock" style="color: var(--acento); font-size: 20px;">0</strong></p>
    
    <input type="number" id="conteo" placeholder="Conteo real">
    
    <div id="div-motivo" style="display: none;">
      <select id="motivo">
        <option value="Venta no registrada">Venta no registrada</option>
        <option value="Consumo interno">Consumo interno</option>
        <option value="Error de conteo">Error de conteo</option>
      </select>
    </div>

       <button class="btn-primario" id="btn-guardar" onclick="guardarCambios()">Guardar Cambios</button>
  </div>

  <!-- ==================== MODAL NUEVO PRODUCTO ==================== -->
  <div id="modal-nuevo-prod" class="modal-prod" onclick="if(event.target.id==='modal-nuevo-prod')cerrarNuevoProducto()">
    <div class="modal-prod-content">
      <div class="modal-prod-header">
        <h3 style="font-size: 16px;">Nuevo producto</h3>
        <button onclick="cerrarNuevoProducto()" style="background:none;border:none;color:var(--suave);font-size:22px;cursor:pointer;">×</button>
      </div>
      <div class="modal-prod-body">
        <label>Nombre *</label>
        <input type="text" id="np-nombre" placeholder="Ej: Gol Surtido 50g">

        <label>Categoría</label>
        <input type="text" id="np-categoria" placeholder="Ej: Dulces" value="General">

        <label>Precio de venta</label>
        <input type="number" id="np-precio" placeholder="0" value="0" min="0" step="0.01">

        <label>Unidad base *</label>
        <input type="text" id="np-unidad" placeholder="Unidad, Caja, Paquete..." value="Unidad">

        <label>Factor (cuántas unidades base vienen en una presentación)</label>
        <input type="number" id="np-factor" placeholder="1" value="1" min="1">

        <label>Stock mínimo (para alertas)</label>
        <input type="number" id="np-stock-min" placeholder="2" value="2" min="0">

        <label>Código de barras (opcional)</label>
        <input type="text" id="np-codigo" placeholder="Ej: 7701234567890">

        <label>¿Controla vencimiento?</label>
        <select id="np-controla-venc">
          <option value="No">No</option>
          <option value="Si">Sí</option>
        </select>
      </div>
      <div class="modal-prod-footer">
        <button class="btn-cancelar-modal" onclick="cerrarNuevoProducto()">Cancelar</button>
        <button class="btn-guardar-modal" id="np-btn-guardar" onclick="guardarNuevoProducto()">Guardar</button>
      </div>
    </div>
  </div>

<script>
let productos = [];
let elegido = null;
let modo = 'inicial';

// --- CARGA INICIAL ---
(async function () {
  mostrarMensaje('Cargando productos...', 'aviso');
  try {
    // Usamos JSONP enviando el texto tal cual
    const r = await apiGet('accion=inventario');
    if (!r.ok) throw new Error(r.error);
    
    productos = r.items;
    mostrarMensaje('¡Catálogo cargado!', 'ok');
    setTimeout(() => { document.getElementById('estado').style.display = 'none'; }, 3000);
    filtrar(); // Mostrar la lista completa al entrar
  } catch (err) {
    mostrarMensaje('Error de conexión: ' + err.message, 'error');
  }
})();

function mostrarMensaje(msg, tipo) {
  const el = document.getElementById('estado');
  el.textContent = msg;
  el.className = tipo;
  el.style.display = 'block';
}

function filtrar() {
  const q = document.getElementById('buscar').value.toLowerCase().trim();
  const cont = document.getElementById('lista');
  cont.innerHTML = '';

  // Filtrar por búsqueda
  let resultados = productos;
  if (q.length > 0) {
    resultados = productos.filter(p => (p.id + ' ' + p.nombre).toLowerCase().includes(q));
  }

  // Orden: Mayor stock primero, con stock <= 0 al final en orden alfabético
  resultados.sort((a, b) => {
    const stockA = a.stock_actual || 0;
    const stockB = b.stock_actual || 0;

    // Si ambos tienen stock > 0, ordenar por mayor stock
    if (stockA > 0 && stockB > 0) return stockB - stockA;

    // Si ambos no tienen stock (<= 0), ordenar alfabéticamente
    if (stockA <= 0 && stockB <= 0) return a.nombre.localeCompare(b.nombre);

    // Los que tienen stock van primero
    return stockB - stockA;
  });

  // Mostrar todos los resultados
  resultados.forEach(p => {
    const d = document.createElement('div');
    d.className = 'card';
    let foto = p.imagen_url ? `<img src="${p.imagen_url}">` : `<div class="inicial">${p.nombre.charAt(0)}</div>`;

    // Color del stock
    let colorStock = '#94A3B8';
    if (p.stock_actual > 0) colorStock = '#10B981';
    if (p.stock_actual === 0) colorStock = '#EF4444';
    if (p.stock_actual < 0) colorStock = '#DC2626';

    d.innerHTML = `${foto}
      <div class="card-info">
        <h3>${p.nombre}</h3>
        <p>${p.id} · Stock: <strong style="color:${colorStock}; font-size:16px;">${p.stock_actual}</strong> ${p.unidad_base || ''}</p>
      </div>`;

    d.onclick = () => {
      elegido = p;
      document.getElementById('panel').style.display = 'block';
      document.getElementById('p-nombre').textContent = p.nombre;
      document.getElementById('p-stock').textContent = p.stock_actual;
      document.getElementById('conteo').value = '';
      cont.innerHTML = '';
      document.getElementById('buscar').value = '';
      document.getElementById('panel').scrollIntoView({ behavior: 'smooth' });
    };
    cont.appendChild(d);
  });

  if (resultados.length === 0) {
    cont.innerHTML = '<p style="text-align:center;color:var(--suave); padding:20px;">No se encontraron productos.</p>';
  }

  // Contador visible
  const contador = document.createElement('p');
  contador.style.cssText = 'text-align:center; color: var(--suave); font-size: 13px; margin: 10px 0;';
  contador.textContent = 'Mostrando ' + resultados.length + ' producto(s)';
  cont.insertBefore(contador, cont.firstChild);
}
async function guardarCambios() {
  if (!elegido) return;
  const cant = Number(document.getElementById('conteo').value);
  if (isNaN(cant)) return mostrarMensaje('Escribe un número válido', 'error');

  document.getElementById('btn-guardar').textContent = 'Guardando...';

  try {
    let r;
    if (modo === 'inicial') {
      r = await apiGet('accion=inventario_inicial&id_producto=' + elegido.id + '&conteo=' + cant);
    } else {
      const mot = document.getElementById('motivo').value;
      r = await apiGet('accion=ajuste_inventario&id_producto=' + elegido.id + '&conteo_real=' + cant + '&motivo=' + encodeURIComponent(mot));
    }

    if (r.ok) {
      mostrarMensaje('Guardado exitosamente', 'ok');
      elegido.stock_actual = (modo === 'inicial') ? r.stock_inicial : r.stock_nuevo;
      document.getElementById('panel').style.display = 'none';
    } else {
      mostrarMensaje(r.error || 'Error al guardar', 'error');
    }
  } catch (err) {
    mostrarMensaje('Error de conexión', 'error');
  } finally {
    document.getElementById('btn-guardar').textContent = 'Guardar Cambios';
  }
}
// --- AVISO AL VOLVER CON CONTEO SIN GUARDAR ---
document.addEventListener('DOMContentLoaded', function() {
  const btnVolver = document.getElementById('btn-volver');
  if (btnVolver) {
    btnVolver.addEventListener('click', function(e) {
      const panel = document.getElementById('panel');
      const panelAbierto = panel && panel.style.display === 'block';
      const conteo = document.getElementById('conteo');
      const hayConteo = conteo && conteo.value.trim() !== '';
      
      if (panelAbierto && hayConteo) {
        const salir = confirm('⚠️ Tienes un conteo sin guardar.\n\n¿Deseas salir sin guardar?');
        if (!salir) {
          e.preventDefault();
          return false;
        }
      }
    });
  }
});
function confirmarVolverInventario() {
  const panel = document.getElementById('panel');
  const panelAbierto = panel && panel.style.display === 'block';
  const conteo = document.getElementById('conteo');
  const hayConteo = conteo && conteo.value.trim() !== '';
  
  if (panelAbierto && hayConteo) {
    const salir = confirm('⚠️ Tienes un conteo sin guardar.\n\n¿Deseas salir sin guardar?');
    if (!salir) return false;
  }
  return true;
}
function cambiarModo(m) {
  modo = m;
  document.getElementById('btn-inicial').className = (m === 'inicial') ? 'active' : '';
  document.getElementById('btn-ajuste').className = (m === 'ajuste') ? 'active' : '';
  document.getElementById('div-motivo').style.display = (m === 'ajuste') ? 'block' : 'none';
  document.getElementById('conteo').value = '';
}
// ============================================
// NUEVO PRODUCTO
// ============================================
function abrirNuevoProducto() {
  document.getElementById('np-nombre').value = '';
  document.getElementById('np-categoria').value = 'General';
  document.getElementById('np-precio').value = '0';
  document.getElementById('np-unidad').value = 'Unidad';
  document.getElementById('np-factor').value = '1';
  document.getElementById('np-stock-min').value = '2';
  document.getElementById('np-codigo').value = '';
  document.getElementById('np-controla-venc').value = 'No';
  document.getElementById('modal-nuevo-prod').classList.add('open');
  setTimeout(() => document.getElementById('np-nombre').focus(), 100);
}

function cerrarNuevoProducto() {
  document.getElementById('modal-nuevo-prod').classList.remove('open');
}

async function guardarNuevoProducto() {
  const nombre = document.getElementById('np-nombre').value.trim();
  if (!nombre) {
    mostrarMensaje('Escribe el nombre del producto', 'error');
    document.getElementById('np-nombre').focus();
    return;
  }

  const datos = {
    nombre: nombre,
    categoria: document.getElementById('np-categoria').value.trim() || 'General',
    precio_venta: Number(document.getElementById('np-precio').value) || 0,
    unidad_base: document.getElementById('np-unidad').value.trim() || 'Unidad',
    factor_default: Number(document.getElementById('np-factor').value) || 1,
    stock_minimo: Number(document.getElementById('np-stock-min').value) || 2,
    codigo_barras: document.getElementById('np-codigo').value.trim(),
    controla_vencimiento: document.getElementById('np-controla-venc').value
  };

  const btn = document.getElementById('np-btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    const r = await apiPost({ accion: 'crear_producto', datos: datos }, 30);
    if (!r.ok) throw new Error(r.error || 'No se pudo crear el producto');

    cerrarNuevoProducto();
    mostrarMensaje('✅ Producto creado: ' + r.nombre + ' (' + r.id_producto + ')', 'ok');

    // Recargar catálogo para que aparezca el nuevo
    const inv = await apiGet('accion=inventario');
    if (inv.ok) {
      productos = inv.items;
      filtrar();
    }
  } catch (err) {
    mostrarMensaje('❌ ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
}
</script>
</body>
</html>
