<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inventario · ArquiDulces</title>
<style>
  :root {
    --bg-app: #0F111A;
    --bg-card: #1A1D2D;
    --bg-input: #25293D;
    --texto: #F8FAFC;
    --texto-suave: #94A3B8;
    --borde: #334155;
    --acento: #F59E0B; /* Naranja dulce para ArquiDulces */
    --acento-bg: rgba(245, 158, 11, 0.15);
    --peligro: #EF4444;
    --exito: #10B981;
    --radio-tarjeta: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg-app); color: var(--texto); padding: 20px; padding-bottom: 100px; }
  
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-top: 10px; }
  .header-top h1 { font-size: 28px; font-weight: 800; color: var(--acento); letter-spacing: -0.5px; }
  .header-top p { font-size: 14px; color: var(--texto-suave); font-weight: 500; margin-top: 4px; }
  
  .toggle-container { background: var(--bg-card); padding: 6px; border-radius: 16px; display: flex; gap: 6px; margin-bottom: 24px; border: 1px solid var(--borde); }
  .toggle-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 700; font-size: 14px; background: transparent; color: var(--texto-suave); cursor: pointer; transition: all 0.2s; }
  .toggle-btn.active { background: var(--acento); color: #000; box-shadow: 0 4px 12px var(--acento-bg); }

  .input-group { margin-bottom: 20px; }
  .input-group label { display: block; font-size: 13px; font-weight: 700; color: var(--texto-suave); margin-bottom: 8px; text-transform: uppercase; }
  input[type="text"], input[type="number"], select { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--borde); background: var(--bg-input); color: var(--texto); font-size: 16px; outline: none; }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--acento); }

  #resultados { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .card-producto { background: var(--bg-card); padding: 16px; border-radius: var(--radio-tarjeta); display: flex; align-items: center; gap: 16px; border: 1px solid var(--borde); cursor: pointer; transition: transform 0.1s; }
  .card-producto:active { transform: scale(0.98); }
  
  .foto-producto { width: 56px; height: 56px; border-radius: 14px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: var(--acento); flex-shrink: 0; overflow: hidden; }
  .foto-producto img { width: 100%; height: 100%; object-fit: cover; }

  .info-producto { flex: 1; min-width: 0; }
  .nombre-producto { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta-producto { font-size: 13px; color: var(--texto-suave); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .badge-stock { padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 13px; }
  .badge-ok { background: rgba(16, 185, 129, 0.2); color: var(--exito); }
  .badge-cero { background: rgba(239, 68, 68, 0.2); color: var(--peligro); }

  .panel-edicion { background: var(--bg-card); padding: 24px; border-radius: var(--radio-tarjeta); border: 1px solid var(--borde); margin-top: 24px; display: none; }
  .panel-edicion h2 { font-size: 20px; margin-bottom: 4px; }
  .stock-actual { font-size: 14px; color: var(--texto-suave); margin-bottom: 24px; }
  .stock-num { font-size: 24px; font-weight: 800; color: var(--acento); }

  .btn-primario { width: 100%; padding: 18px; border-radius: 16px; border: none; background: var(--acento); color: #000; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 24px; }
  .btn-primario:active { opacity: 0.8; }

  #estado { padding: 16px; border-radius: 16px; font-weight: 600; font-size: 14px; text-align: center; margin-bottom: 20px; display: none; }
  .estado-ok { background: rgba(16, 185, 129, 0.15); color: var(--exito); border: 1px solid var(--exito); }
  .estado-error { background: rgba(239, 68, 68, 0.15); color: var(--peligro); border: 1px solid var(--peligro); }
  .estado-aviso { background: var(--acento-bg); color: var(--acento); border: 1px solid var(--acento); }
</style>
</head>
<body>

<header class="header-top">
  <div>
    <h1>ArquiDulces</h1>
    <p>Control de Inventario</p>
  </div>
</header>

<div id="estado" class="estado-aviso">Cargando inventario...</div>

<div class="toggle-container">
  <button id="modoInicial" class="toggle-btn active">Conteo Inicial</button>
  <button id="modoAjuste" class="toggle-btn">Ajuste de Stock</button>
</div>

<div class="input-group">
  <label>Buscar Producto</label>
  <input type="text" id="buscar" placeholder="Escribe 2 letras o más..." autocomplete="off">
  <label style="display:flex; align-items:center; gap:8px; margin-top:16px; text-transform:none; font-size:14px;">
    <input type="checkbox" id="soloPendientes"> Mostrar solo productos con stock 0
  </label>
</div>

<div id="resultados"></div>

<div class="panel-edicion" id="panel">
  <h2 id="infoNombre">Producto</h2>
  <div class="stock-actual">Stock del sistema: <span class="stock-num" id="infoStock">0</span></div>
  
  <div style="margin-bottom: 24px; margin-top: 16px;">
    <button id="btnSubirFoto" style="background: var(--bg-input); color: var(--acento); border: 1px dashed var(--acento); padding: 12px; border-radius: 12px; width: 100%; font-weight: 700; cursor: pointer;">
      📷 Subir o cambiar foto
    </button>
    <input type="file" id="inputFoto" accept="image/*" style="display: none;">
  </div>

  <div class="input-group">
    <label>Conteo Físico Real (Unidades)</label>
    <input type="number" id="conteo" min="0" step="1" inputmode="numeric" placeholder="Ej: 12">
  </div>

  <div class="input-group" id="bloqueMotivo" style="display:none;">
    <label>Motivo del Ajuste</label>
    <select id="motivo">
      <option value="">Elige el motivo...</option>
      <option value="Venta no registrada">Venta no registrada</option>
      <option value="Consumo interno">Consumo interno</option>
      <option value="Error del sistema">Error del sistema</option>
      <option value="Producto dañado / vencido">Producto dañado / vencido</option>
      <option value="Otro">Otro</option>
    </select>
  </div>

  <div class="input-group">
    <label>Observaciones (Opcional)</label>
    <input type="text" id="obs" maxlength="200" placeholder="Ej: Faltaron 3 por error...">
  </div>

  <button class="btn-primario" id="btnGuardar">Guardar Cambios</button>
</div>

<script>
// --- CONFIGURACIÓN DIRECTA (Sin comun.js) ---
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxJTtF1dkIdS21iiDer0mYOoykbRKMs6yEqZlL8uxNMNVmvY6jr0dMrWbD_He7kO5GU/exec';

async function apiGet(params) {
  const url = new URL(WEB_APP_URL);
  Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
  url.searchParams.append('_t', Date.now());
  const res = await fetch(url, { method: 'GET', redirect: 'follow' });
  if (!res.ok) throw new Error('Error de red: ' + res.status);
  return await res.json();
}

function mostrar(msg, tipo) {
  const el = document.getElementById('estado');
  el.textContent = msg;
  el.className = 'estado-' + (tipo || 'aviso');
  el.style.display = 'block';
  if(tipo === 'ok') setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// --- LÓGICA DE LA APP ---
let productos = [];
let elegido = null;
let modo = 'inicial';

(async function () {
  try {
    const r = await apiGet({ accion: 'inventario' });
    if (!r.ok) throw new Error(r.error);
    productos = r.items;
    mostrar('Elige un producto para continuar', 'ok');
    pintarResultados();
  } catch (err) {
    mostrar('Error al cargar: ' + err.message, 'error');
  }
})();

function norm(s) { return String(s || '').toLowerCase().trim(); }

function pintarResultados() {
  const q = norm(document.getElementById('buscar').value);
  const soloPend = document.getElementById('soloPendientes').checked;
  const cont = document.getElementById('resultados');
  cont.innerHTML = '';

  if (q.length < 2 && !soloPend) return;

  let items = productos.slice();
  if (soloPend) items = items.filter(p => p.stock_actual === 0);
  if (q) items = items.filter(p => norm(p.id + ' ' + p.nombre).indexOf(q) >= 0);

  items = items.slice(0, 20);

  if (!items.length) {
    cont.innerHTML = '<div style="text-align:center; padding:20px; color:var(--texto-suave);">Sin resultados.</div>';
    return;
  }

  items.forEach(p => {
    const d = document.createElement('div');
    d.className = 'card-producto';

    let fotoHTML = '';
    if (p.imagen_url) {
      fotoHTML = `<img src="${p.imagen_url}" alt="" loading="lazy">`;
    } else {
      fotoHTML = p.nombre.charAt(0).toUpperCase();
    }

    let stockClase = 'badge-ok';
    if (p.stock_actual === 0) stockClase = 'badge-cero';

    d.innerHTML = `
      <div class="foto-producto">${fotoHTML}</div>
      <div class="info-producto">
        <div class="nombre-producto">${p.nombre}</div>
        <div class="meta-producto">
          <span>${p.id}</span>
          <span class="badge-stock ${stockClase}">${p.stock_actual} und</span>
        </div>
      </div>
    `;

    d.addEventListener('click', () => {
      elegido = p;
      mostrarPanel();
      document.getElementById('resultados').innerHTML = '';
      document.getElementById('buscar').value = '';
    });

    cont.appendChild(d);
  });
}

function mostrarPanel() {
  const panel = document.getElementById('panel');
  panel.style.display = 'block';
  document.getElementById('infoNombre').textContent = elegido.nombre;
  document.getElementById('infoStock').textContent = elegido.stock_actual;
  document.getElementById('conteo').value = '';
  document.getElementById('obs').value = '';
  document.getElementById('motivo').value = '';
  panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function fijarModo(m) {
  modo = m;
  document.getElementById('modoInicial').classList.toggle('active', m === 'inicial');
  document.getElementById('modoAjuste').classList.toggle('active', m === 'ajuste');
  document.getElementById('bloqueMotivo').style.display = (m === 'ajuste') ? 'block' : 'none';
}

document.getElementById('modoInicial').addEventListener('click', () => fijarModo('inicial'));
document.getElementById('modoAjuste').addEventListener('click', () => fijarModo('ajuste'));
document.getElementById('buscar').addEventListener('input', pintarResultados);
document.getElementById('soloPendientes').addEventListener('change', pintarResultados);

document.getElementById('btnGuardar').addEventListener('click', async function () {
  if (!elegido) return;
  const conteo = Number(document.getElementById('conteo').value);
  
  if (isNaN(conteo) || conteo < 0) {
    mostrar('El conteo debe ser un número válido', 'error'); return;
  }

  if (modo === 'ajuste' && !document.getElementById('motivo').value) {
    mostrar('Elige un motivo para el ajuste', 'error'); return;
  }

  this.disabled = true;
  this.textContent = 'Guardando...';

  try {
    let r;
    if (modo === 'inicial') {
      r = await apiGet({ accion: 'inventario_inicial', id_producto: elegido.id, conteo: conteo, id_usuario: 'Admin' });
    } else {
      r = await apiGet({ accion: 'ajuste_inventario', id_producto: elegido.id, conteo_real: conteo, id_usuario: 'Admin', motivo: document.getElementById('motivo').value, observaciones: document.getElementById('obs').value });
    }

    if (r.ok) {
      mostrar('Guardado exitosamente', 'ok');
      elegido.stock_actual = (modo === 'inicial') ? r.stock_inicial : r.stock_nuevo;
      document.getElementById('panel').style.display = 'none';
      pintarResultados();
    } else {
      mostrar(r.error || 'Error al guardar', 'error');
    }
  } catch (err) {
    mostrar('Error de conexión', 'error');
  } finally {
    this.disabled = false;
    this.textContent = 'Guardar Cambios';
  }
});

// --- LÓGICA PARA SUBIR FOTOS ---
document.getElementById('btnSubirFoto').addEventListener('click', function() {
  document.getElementById('inputFoto').click();
});

document.getElementById('inputFoto').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(event) {
    const base64 = event.target.result;
    document.getElementById('btnSubirFoto').textContent = 'Subiendo...';
    document.getElementById('btnSubirFoto').disabled = true;

    try {
      const r = await apiGet({ accion: 'subir_foto', id_producto: elegido.id, base64: base64 });
      if (r.ok) {
        mostrar('Foto actualizada con éxito', 'ok');
        elegido.imagen_url = r.url;
        // Recargamos la lista para que se vea la foto
        pintarResultados(); 
      } else {
        mostrar(r.error || 'Error al subir', 'error');
      }
    } catch (err) {
      mostrar('Error de conexión al subir foto', 'error');
    } finally {
      document.getElementById('btnSubirFoto').textContent = '📷 Subir o cambiar foto';
      document.getElementById('btnSubirFoto').disabled = false;
      document.getElementById('inputFoto').value = '';
    }
  };
  reader.readAsDataURL(file);
});
</script>
</body>
</html>
