<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Recordatorios · Distribuidora TAT</title>
<script src="auth.js"></script>
<script src="comun.js?v=11"></script>
<link rel="stylesheet" href="tema.css">
<style>
  /* Personalización específica de recordatorios */
  
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  
  .stat-card {
    background: var(--card);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
    box-shadow: var(--shadow-1);
    transition: 0.15s;
  }
  
  .stat-card:active {
    transform: scale(0.97);
  }
  
  .stat-num {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  
  .stat-lbl {
    font-size: 10px;
    color: var(--suave);
    margin-top: 4px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  
  .stat-card.stock .stat-num { color: var(--peligro); }
  .stat-card.venc .stat-num { color: var(--warning); }
  .stat-card.precio .stat-num { color: var(--info); }
  .stat-card.dev .stat-num { color: #A855F7; }
  
  .filtros-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  
  .filtros-grid select {
    margin-bottom: 0;
    padding: 10px 14px;
    font-size: 13px;
  }
  
  /* Recordatorios */
  .rec-item {
    background: var(--card);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-1);
    border-left: 4px solid var(--borde);
    transition: 0.15s;
  }
  
  .rec-item.stock_bajo { border-left-color: var(--peligro); }
  .rec-item.vencimiento_proximo { border-left-color: var(--warning); }
  .rec-item.incremento_precio { border-left-color: var(--info); }
  .rec-item.devolucion_pendiente { border-left-color: #A855F7; }
  .rec-item.completado { opacity: 0.55; border-left-color: var(--borde); }
  
  .rec-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 8px;
  }
  
  .rec-msg {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--texto);
  }
  
  .tipo-badge {
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 9999px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  
  .tipo-badge.stock_bajo { background: var(--peligro-bg); color: var(--peligro); }
  .tipo-badge.vencimiento_proximo { background: var(--warning-bg); color: var(--warning); }
  .tipo-badge.incremento_precio { background: var(--info-bg); color: var(--info); }
  .tipo-badge.devolucion_pendiente { background: #F3E8FF; color: #A855F7; }
  
  .rec-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--suave);
  }
  
  .btn-completar {
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid var(--ok);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
  }
  
  .btn-completar:hover {
    background: var(--ok);
    color: #FFF;
  }
  
  .btn-completar:active {
    transform: scale(0.96);
  }
  
  .completado-badge {
    color: var(--ok);
    font-weight: 700;
    font-size: 12px;
  }
</style>
</head>
<body>

  <!-- ============================================
       HEADER
       ============================================ -->
  <div class="page-header">
    <div class="page-header-left">
      <h1 style="color: var(--acento); margin: 0;">Recordatorios</h1>
      <p class="subtitulo">Alertas inteligentes del inventario</p>
    </div>
    <div class="page-header-right">
  <button class="icon-btn" id="btn-tema" onclick="Tema.cambiar()" title="Cambiar tema">🌙</button>
  <button class="icon-btn" onclick="window.location.href='index.html'" title="Volver">←</button>
</div>
  </div>

  <div id="estado" style="display: none;"></div>

  <!-- ============================================
       STATS
       ============================================ -->
  <div class="stats-grid">
    <div class="stat-card stock">
      <div class="stat-num" id="stat-stock">-</div>
      <div class="stat-lbl">Stock bajo</div>
    </div>
    <div class="stat-card venc">
      <div class="stat-num" id="stat-venc">-</div>
      <div class="stat-lbl">Por vencer</div>
    </div>
    <div class="stat-card precio">
      <div class="stat-num" id="stat-precio">-</div>
      <div class="stat-lbl">Subieron</div>
    </div>
    <div class="stat-card dev">
      <div class="stat-num" id="stat-dev">-</div>
      <div class="stat-lbl">Devoluciones</div>
    </div>
  </div>

  <!-- ============================================
       FILTROS
       ============================================ -->
  <div class="filtros-grid">
    <select id="filtro-estado" onchange="cargarRecordatorios()">
      <option value="pendiente">Pendientes</option>
      <option value="completado">Completados</option>
      <option value="">Todos</option>
    </select>
    <select id="filtro-tipo" onchange="cargarRecordatorios()">
      <option value="">Todos los tipos</option>
      <option value="stock_bajo">Stock bajo</option>
      <option value="vencimiento_proximo">Por vencer</option>
      <option value="incremento_precio">Subieron de precio</option>
      <option value="devolucion_pendiente">Devoluciones</option>
    </select>
  </div>

  <!-- ============================================
       LISTA
       ============================================ -->
  <div id="lista-recordatorios">
    <div class="empty-state">
      <div class="empty-state-icon">⏳</div>
      <div class="empty-state-text">Cargando...</div>
    </div>
  </div>

<script>
let recordatorios = [];

const TIPO_LABELS = {
  stock_bajo: 'Stock bajo',
  vencimiento_proximo: 'Por vencer',
  incremento_precio: 'Subió precio',
  devolucion_pendiente: 'Devolución'
};

(async function init() {
  await cargarRecordatorios();
  await cargarStats();
})();

async function cargarRecordatorios() {
  const lista = document.getElementById('lista-recordatorios');
  lista.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-text">Cargando...</div></div>';
  
  const filtros = {
    estado: document.getElementById('filtro-estado').value,
    tipo: document.getElementById('filtro-tipo').value
  };
  
  try {
    const r = await apiPost({ accion: 'listar_recordatorios', filtros: filtros }, 30);
    if (!r.ok) throw new Error(r.error);
    
    recordatorios = r.items || [];
    
    if (recordatorios.length === 0) {
      lista.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎉</div><div class="empty-state-text">No hay recordatorios en este filtro.</div></div>';
      return;
    }
    
    let html = '';
    recordatorios.forEach(function(rec) {
      const tipoLabel = TIPO_LABELS[rec.tipo] || rec.tipo;
      const fecha = rec.fecha_creacion ? formatearFecha(rec.fecha_creacion) : '';
      const esCompletado = rec.estado === 'completado';
      
      html += '<div class="rec-item ' + rec.tipo + (esCompletado ? ' completado' : '') + '">' +
        '<div class="rec-header">' +
          '<div class="rec-msg">' + rec.mensaje + '</div>' +
          '<span class="tipo-badge ' + rec.tipo + '">' + tipoLabel + '</span>' +
        '</div>' +
        '<div class="rec-footer">' +
          '<span>' + rec.id + ' · ' + fecha + '</span>' +
          (esCompletado ? '<span class="completado-badge">✓ Completado</span>' : '<button class="btn-completar" onclick="marcarCompletado(\'' + rec.id + '\')">Marcar completado</button>') +
        '</div>' +
      '</div>';
    });
    lista.innerHTML = html;
  } catch (e) {
    lista.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-text" style="color: var(--peligro);">Error: ' + e.message + '</div></div>';
  }
}

async function cargarStats() {
  try {
    const r = await apiPost({ accion: 'listar_recordatorios', filtros: { estado: 'pendiente' } }, 30);
    if (!r.ok) return;
    
    const items = r.items || [];
    const conteo = { stock_bajo: 0, vencimiento_proximo: 0, incremento_precio: 0, devolucion_pendiente: 0 };
    items.forEach(function(rec) {
      if (conteo[rec.tipo] !== undefined) conteo[rec.tipo]++;
    });
    
    document.getElementById('stat-stock').textContent = conteo.stock_bajo;
    document.getElementById('stat-venc').textContent = conteo.vencimiento_proximo;
    document.getElementById('stat-precio').textContent = conteo.incremento_precio;
    document.getElementById('stat-dev').textContent = conteo.devolucion_pendiente;
  } catch (e) { console.error(e); }
}

async function marcarCompletado(id) {
  if (!confirm('¿Marcar este recordatorio como completado?')) return;
  
  try {
    const r = await apiPost({ accion: 'marcar_recordatorio', id_recordatorio: id }, 30);
    if (r.ok) {
      mostrarEstado('✅ Recordatorio completado', 'ok');
      await cargarRecordatorios();
      await cargarStats();
      setTimeout(function() { document.getElementById('estado').style.display = 'none'; }, 2000);
    } else {
      mostrarEstado('❌ Error: ' + r.error, 'error');
    }
  } catch (e) {
    mostrarEstado('❌ Error de conexión: ' + e.message, 'error');
  }
}

function mostrarEstado(msg, tipo) {
  const el = document.getElementById('estado');
  el.textContent = msg;
  el.className = tipo;
  el.style.display = 'block';
  // Aplicar estilos del tema a los estados
  if (tipo === 'ok') {
    el.style.background = 'var(--ok-bg)';
    el.style.color = 'var(--ok)';
    el.style.border = '1px solid var(--ok)';
    el.style.padding = '14px';
    el.style.borderRadius = '12px';
    el.style.textAlign = 'center';
    el.style.fontWeight = 'bold';
    el.style.fontSize = '14px';
    el.style.marginBottom = '16px';
  } else if (tipo === 'error') {
    el.style.background = 'var(--peligro-bg)';
    el.style.color = 'var(--peligro)';
    el.style.border = '1px solid var(--peligro)';
    el.style.padding = '14px';
    el.style.borderRadius = '12px';
    el.style.textAlign = 'center';
    el.style.fontWeight = 'bold';
    el.style.fontSize = '14px';
    el.style.marginBottom = '16px';
  }
}

function formatearFecha(fecha) {
  if (!fecha) return '';
  const d = new Date(fecha);
  const dia = String(d.getDate()).padStart(2, '0');
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const año = d.getFullYear();
  const hora = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  return dia + '/' + mes + '/' + año + ' ' + hora + ':' + min;
}
</script>
</body>
</html>
