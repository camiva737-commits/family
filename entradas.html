<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Entradas · Distribuidora TAT</title>
<script src="comun.js?v=8"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css">
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
<style>
  :root {
    --bg: #0F111A; --card: #1A1D2D; --input: #25293D; --texto: #F8FAFC; 
    --suave: #94A3B8; --borde: #334155; --acento: #10B981; --peligro: #EF4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--texto); padding: 20px; padding-bottom: 50px; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 { font-size: 24px; color: var(--acento); font-weight: 800; }
  .btn-volver { background: none; border: none; color: var(--suave); font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; }

  #estado { padding: 14px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 16px; display: none; white-space: pre-line; }
  .ok { background: rgba(16, 185, 129, 0.2); color: var(--acento); border: 1px solid var(--acento); }
  .error { background: rgba(239, 68, 68, 0.2); color: var(--peligro); border: 1px solid var(--peligro); }

  input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--borde); background: var(--input); color: var(--texto); font-size: 16px; margin-bottom: 12px; outline: none; }
  
  .card { background: var(--card); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--borde); }
  
  .linea { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--borde); cursor: pointer; }
  .linea:last-child { border-bottom: none; }
  .linea-info { flex: 1; }
  .linea-info h4 { font-size: 15px; }
  .linea-info p { font-size: 13px; color: var(--suave); margin-top: 4px; }
  .badge-unidad { display: inline-block; background: var(--borde); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-left: 6px; color: var(--texto); }
  .btn-eliminar { background: none; border: none; color: var(--peligro); font-size: 20px; cursor: pointer; padding: 5px; }

  .btn-primario { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--acento); color: #000; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
  .btn-primario:disabled { opacity: 0.6; }
  .btn-secundario { width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed var(--acento); background: transparent; color: var(--acento); font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }

  #buscador-wrapper { display: none; background: var(--bg); position: sticky; top: 0; padding: 10px 0; z-index: 10; }
  .resultado { padding: 12px; background: var(--card); border-bottom: 1px solid var(--borde); cursor: pointer; }
  .resultado:active { background: var(--input); }

  .input-camara-group { display: flex; gap: 10px; align-items: stretch; margin-bottom: 12px; }
  .input-camara-group input { margin-bottom: 0; flex: 1; min-width: 0; }
  .btn-camara { padding: 0 16px; border-radius: 12px; background: var(--acento); border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-camara:disabled { opacity: 0.5; }
  /* Pestañas */
  .tabs { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--borde); }
  .tabs button { flex: 1; padding: 12px; border: none; border-radius: 10px; background: transparent; color: var(--suave); font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
  .tabs button.active { background: var(--acento); color: #000; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  /* Historial */
  .hist-filtros { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  .hist-filtros input, .hist-filtros select { margin-bottom: 0; padding: 10px; font-size: 13px; }
  .hist-item { background: var(--card); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
  .hist-item:active { background: var(--input); }
  .hist-item-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 6px; }
  .hist-item-header h4 { font-size: 14px; margin: 0; }
  .hist-item-header .total { font-size: 15px; font-weight: bold; color: var(--acento); }
  .hist-item p { font-size: 12px; color: var(--suave); margin: 2px 0; }
  .hist-item .badge { display: inline-block; background: var(--borde); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
  
  /* Modal detalle */
  .modal-detalle { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-detalle.open { display: flex; }
  .modal-detalle-content { background: var(--card); border-radius: 16px; max-width: 500px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
  .modal-detalle-header { padding: 16px; background: var(--input); border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: center; }
  .modal-detalle-body { padding: 16px; overflow-y: auto; }
  .detalle-producto { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--borde); }
  .detalle-producto:last-child { border-bottom: none; }
  .detalle-producto-info h5 { font-size: 14px; margin: 0 0 2px 0; }
  .detalle-producto-info p { font-size: 12px; color: var(--suave); margin: 0; }
  .detalle-producto-total { text-align: right; font-size: 13px; }
  .detalle-producto-total strong { color: var(--acento); }
</style>
</head>
<body>

    <div class="header">
    <h1>Recepción</h1>
    <a href="index.html" class="btn-volver" onclick="return confirmarVolverEntrada()">← Volver</a>
  </div>

  <div class="tabs">
    <button id="tab-nueva-btn" class="active" onclick="cambiarTabRecepcion('nueva')">📥 Nueva recepción</button>
    <button id="tab-hist-btn" onclick="cambiarTabRecepcion('historial')">📋 Historial</button>
  </div>

  <!-- ==================== TAB NUEVA ==================== -->
  <div id="tab-nueva" class="tab-content active">

    <div id="estado" class="ok" style="display: block;">Cargando productos...</div>

    <div class="card">
      <div class="input-camara-group">
        <input type="text" id="factura" placeholder="Número de factura">
        <button class="btn-camara" title="Tomar foto de la factura" onclick="document.getElementById('fotoCamara').click()">📷</button>
        <button class="btn-camara" title="Elegir foto de la galería" onclick="document.getElementById('fotoGaleria').click()">🖼️</button>
        <button class="btn-camara" id="btn-microfono" title="Dictar por voz" onclick="iniciarDictado()">🎤</button>
      </div>
      <input type="file" id="fotoCamara" accept="image/*" capture="environment" style="display: none;" onchange="procesarFotoIA(this)">
      <input type="file" id="fotoGaleria" accept="image/*" style="display: none;" onchange="procesarFotoIA(this)">
      
      <select id="proveedor">
        <option value="">Seleccione Proveedor...</option>
        <option value="7314450-5">Distribuidora Jencar</option>
        <option value="9010515728.0">Dulces y Marcas S.A.S</option>
        <option value="7223562-0">Margarita</option>
        <option value="860020308-9">Comestibles Ricos S.A</option>
      </select>
    </div>

    <div id="lista-lineas" class="card">
      <p style="text-align: center; color: var(--suave); font-size: 14px;">No hay productos agregados.</p>
    </div>

    <button class="btn-secundario" onclick="abrirBuscador()">+ Agregar Producto Manualmente</button>
    <button class="btn-primario" id="btn-guardar" onclick="guardarEntrada()">Guardar Recepción</button>
    <button class="btn-secundario" onclick="limpiarEntrada()" style="margin-top: 10px;">🗑️ Limpiar lista</button>

  </div>

  <!-- ==================== TAB HISTORIAL ==================== -->
  <div id="tab-historial" class="tab-content">

    <div class="card">
      <div class="hist-filtros">
        <input type="text" id="hist-busqueda" placeholder="🔍 Producto o factura..." oninput="cargarHistorial()">
        <select id="hist-proveedor" onchange="cargarHistorial()">
          <option value="">Todos los proveedores</option>
        </select>
        <input type="date" id="hist-fecha-desde" onchange="cargarHistorial()">
        <input type="date" id="hist-fecha-hasta" onchange="cargarHistorial()">
      </div>
    </div>

    <div id="hist-lista">
      <p style="text-align: center; color: var(--suave); font-size: 14px;">Toca "Historial" para cargar...</p>
    </div>

  </div>

  <!-- ==================== BUSCADOR FLOTANTE ==================== -->
  <div id="buscador-wrapper">
    <input type="text" id="input-buscar" placeholder="Buscar producto..." oninput="filtrar()">
    <div id="resultados-busqueda" style="max-height: 300px; overflow-y: auto; border-radius: 12px; overflow: hidden;"></div>
    <button class="btn-volver" style="margin-top: 10px; color: var(--peligro);" onclick="cerrarBuscador()">Cancelar</button>
  </div>

  <!-- ==================== MODAL DETALLE RECEPCIÓN ==================== -->
  <div id="modal-detalle" class="modal-detalle" onclick="if(event.target.id==='modal-detalle')cerrarDetalle()">
    <div class="modal-detalle-content">
      <div class="modal-detalle-header">
        <h3 style="font-size: 16px;">Detalle de recepción</h3>
        <button onclick="cerrarDetalle()" style="background:none;border:none;color:var(--suave);font-size:22px;cursor:pointer;">×</button>
      </div>
      <div class="modal-detalle-body" id="detalle-contenido">
        Cargando...
      </div>
    </div>
  </div>

  <!-- ==================== MODAL RECORTE ==================== -->
  <div id="modal-recorte" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
    <p style="color:#FFF; font-size:16px; font-weight:bold; margin-bottom:10px; text-align:center;">
      Ajusta el recuadro para que solo quede la factura
    </p>
    <div style="width:100%; max-width:600px; height:60vh; background:#000; border-radius:12px; overflow:hidden;">
      <img id="imagen-a-recortar" style="max-width:100%; display:block;">
    </div>
    <div style="display:flex; gap:10px; margin-top:20px; width:100%; max-width:600px;">
      <button onclick="cancelarRecorte()" style="flex:1; padding:14px; border-radius:12px; border:1px solid #94A3B8; background:transparent; color:#94A3B8; font-weight:bold; font-size:14px; cursor:pointer;">
        Cancelar
      </button>
      <button onclick="usarImagenCompleta()" style="flex:1; padding:14px; border-radius:12px; border:1px solid #F59E0B; background:transparent; color:#F59E0B; font-weight:bold; font-size:14px; cursor:pointer;">
        Enviar completa
      </button>
      <button onclick="aplicarRecorte()" style="flex:1; padding:14px; border-radius:12px; border:none; background:#10B981; color:#000; font-weight:bold; font-size:14px; cursor:pointer;">
        Usar esta área
      </button>
    </div>
  </div>

<script>
let productos = [];
let lineasAgregadas = [];
let indexEditando = -1; // -1 = agregar nuevo; >= 0 = reemplazar pendiente

// --- CARGA INICIAL DEL CATÁLOGO ---
(async function () {
  try {
    const r = await apiGet('accion=inventario');
    if (!r.ok) throw new Error(r.error);
    productos = r.items;
    document.getElementById('estado').style.display = 'none';
  } catch (err) {
    document.getElementById('estado').textContent = 'Error al cargar catálogo: ' + err.message;
    document.getElementById('estado').className = 'error';
  }
})();

// --- PROCESAR FOTO CON RECORTE ---
let cropper = null;
let inputFotoActual = null;

async function procesarFotoIA(input) {
  const file = input.files[0];
  if (!file) return;
  
  inputFotoActual = input;
  
  const modal = document.getElementById('modal-recorte');
  const img = document.getElementById('imagen-a-recortar');
  
  const url = URL.createObjectURL(file);
  img.src = url;
  modal.style.display = 'flex';
  
  img.onload = function() {
    if (cropper) cropper.destroy();
    cropper = new Cropper(img, {
      viewMode: 1,
      autoCropArea: 0.9,
      background: false,
      responsive: true,
      guides: true,
      movable: true,
      zoomable: true,
      scalable: false,
      rotatable: false
    });
  };
}

function cancelarRecorte() {
  const modal = document.getElementById('modal-recorte');
  modal.style.display = 'none';
  if (cropper) { cropper.destroy(); cropper = null; }
  if (inputFotoActual) { inputFotoActual.value = ''; }
}

async function usarImagenCompleta() {
  const modal = document.getElementById('modal-recorte');
  const img = document.getElementById('imagen-a-recortar');
  
  modal.style.display = 'none';
  if (cropper) { cropper.destroy(); cropper = null; }
  
  await enviarFotoIA(img.src, true);
  if (inputFotoActual) { inputFotoActual.value = ''; }
}

async function aplicarRecorte() {
  if (!cropper) return;
  
  const modal = document.getElementById('modal-recorte');
  
  // Obtener el canvas recortado
  const canvasOriginal = cropper.getCroppedCanvas({
  maxWidth: 2400,
  maxHeight: 2400,
  imageSmoothingQuality: 'high'
});
  
  // Mejorar la imagen: aumentar contraste y brillo
  const canvasMejorado = document.createElement('canvas');
  canvasMejorado.width = canvasOriginal.width;
  canvasMejorado.height = canvasOriginal.height;
  const ctx = canvasMejorado.getContext('2d');
  
  // Filtro CSS de mejora
  ctx.filter = 'contrast(1.3) brightness(1.1) grayscale(0.2)';
  ctx.drawImage(canvasOriginal, 0, 0);
  
 const dataUrl = canvasMejorado.toDataURL('image/jpeg', 0.92);
  
  modal.style.display = 'none';
  if (cropper) { cropper.destroy(); cropper = null; }
  
  await enviarFotoIA(dataUrl, false);
  if (inputFotoActual) { inputFotoActual.value = ''; }
}

async function enviarFotoIA(dataUrl, esCompleta) {
  const botones = document.querySelectorAll('.btn-camara');
  botones.forEach(b => { b.disabled = true; });
  
  const estado = document.getElementById('estado');
  estado.className = 'ok';
  estado.textContent = (esCompleta ? 'Enviando imagen completa' : 'Enviando recorte') + ' a la IA... (puede tardar unos segundos)';
  estado.style.display = 'block';
  
  try {
    const r = await apiPost({ accion: 'escanear_ia', base64: dataUrl }, 90);
    
    if (!r.ok) throw new Error(r.error || 'No se pudo leer la factura');
    
    if (r.factura && document.getElementById('factura')) {
      document.getElementById('factura').value = r.factura;
    }
    
    (r.lineas || []).forEach(l => {
      const match = productos.find(p => p.id === l.id_producto);
      lineasAgregadas.push({
        id_producto: l.id_producto,
        nombre: l.nombre,
        unidad: match ? (match.unidad_base || l.unidad || 'Unidad') : (l.unidad || 'Unidad'),
        cantidad: l.cantidad,
        precio: l.precio || '',
        stock_sistema: match ? (match.stock_actual || 0) : 0
      });
    });
    
    (r.sin_coincidencia || []).forEach(nombreOriginal => {
      lineasAgregadas.push({
        id_producto: null,
        nombre: nombreOriginal,
        unidad: 'Pendiente',
        cantidad: 1,
        stock_sistema: 0
      });
    });
    
    if (typeof renderizarLineas === 'function') renderizarLineas();
    
    let msg = 'Factura leída. Productos agregados: ' + (r.lineas || []).length + '.';
    if (r.sin_coincidencia && r.sin_coincidencia.length) {
      msg += '\n\nNo reconocí estos, agrégalos manualmente:\n- ' + r.sin_coincidencia.join('\n- ');
    }
    alert(msg);
    estado.style.display = 'none';
  } catch (err) {
    estado.className = 'error';
    estado.textContent = 'Error: ' + err.message;
  } finally {
    botones.forEach(b => { b.disabled = false; });
  }
}

// --- BUSCADOR MANUAL ---
function abrirBuscador(index) {
  indexEditando = (typeof index === 'number') ? index : -1;
  document.getElementById('buscador-wrapper').style.display = 'block';
  document.getElementById('input-buscar').focus();
}

function abrirBuscadorParaReemplazar(index) {
  abrirBuscador(index);
}

function cerrarBuscador() {
  document.getElementById('buscador-wrapper').style.display = 'none';
  document.getElementById('input-buscar').value = '';
  document.getElementById('resultados-busqueda').innerHTML = '';
}

function filtrar() {
  const q = document.getElementById('input-buscar').value.toLowerCase();
  const cont = document.getElementById('resultados-busqueda');
  cont.innerHTML = '';
  if (q.length < 2) return;

  productos.filter(p => (p.id + ' ' + p.nombre).toLowerCase().includes(q)).slice(0, 10).forEach(p => {
    const d = document.createElement('div');
    d.className = 'resultado';
    d.innerHTML = `<strong>${p.nombre}</strong> <span style="color:var(--suave);font-size:12px;">(${p.id})</span>`;
    d.onclick = () => agregarLinea(p);
    cont.appendChild(d);
  });
}

function agregarLinea(p) {
  cerrarBuscador();
  
  // controla_vencimiento ya viene como booleano del backend
  const controlaVenc = p.controla_vencimiento === true;
  
  if (indexEditando === -1) {
    // Agregar nuevo manual
    const cant = prompt(`¿Cuántas unidades de ${p.nombre} llegaron?`);
    if (!cant || isNaN(cant)) return;
    
    const precio = prompt(`¿A qué precio de compra llegó cada ${(p.unidad_base || 'Unidad').toLowerCase()} de ${p.nombre}?\n\n(Ej: 1811)`);
    if (precio === null) return;
    const precioNum = precio && !isNaN(precio) ? Number(precio) : '';
    
    // Pedir fecha de vencimiento si el producto controla vencimiento
    let fechaVenc = '';
    if (controlaVenc) {
      const fecha = prompt(
        `Este producto controla vencimiento.\n\n¿Cuál es la FECHA DE VENCIMIENTO del lote?\n\nFormato: AAAA-MM-DD (ej: 2027-03-15)\n\n(Deja vacío si no la sabes)`
      );
      if (fecha && fecha.trim()) {
        const fechaObj = new Date(fecha);
        if (!isNaN(fechaObj.getTime())) {
          fechaVenc = fecha.trim();
        } else {
          alert('Fecha inválida. Se guardará sin fecha de vencimiento.');
        }
      }
    }
    
    lineasAgregadas.push({
      id_producto: p.id,
      nombre: p.nombre,
      unidad: p.unidad_base || 'Unidad',
      cantidad: Number(cant),
      precio: precioNum,
      vencimiento: fechaVenc
    });
  } else {
    // Reemplazar pendiente
    const anterior = lineasAgregadas[indexEditando];
    
    if (!anterior.id_producto) {
      const confirmarTexto = confirm(
        `La IA leyó: "${anterior.nombre}"\n\n` +
        `¿Es correcto este texto en la factura?\n\n` +
        `• Aceptar = Sí, es correcto\n` +
        `• Cancelar = No, era otro texto`
      );
      
      if (confirmarTexto) {
        apiPost({
          accion: 'guardar_alias',
          alias: anterior.nombre,
          id_producto: p.id
        }).then(r => console.log('✅ Alias guardado:', r));
      } else {
        const textoReal = prompt(
          `¿Cuál era el texto REAL en la factura? (escríbelo tal cual aparecía)`,
          ''
        );
        if (textoReal && textoReal.trim()) {
          apiPost({
            accion: 'guardar_alias',
            alias: textoReal.trim(),
            id_producto: p.id
          }).then(r => console.log('✅ Alias correcto guardado:', r));
        }
      }
    }
    
    const cant = prompt(`¿Cuántas unidades de ${p.nombre}?`, anterior.cantidad || 1);
    if (!cant || isNaN(cant)) return;
    
    const precio = prompt(`¿A qué precio de compra llegó cada ${(p.unidad_base || 'Unidad').toLowerCase()} de ${p.nombre}?`, anterior.precio || '');
    if (precio === null) return;
    const precioNum = precio && !isNaN(precio) ? Number(precio) : '';
    
    // Pedir fecha de vencimiento si controla
    let fechaVenc = anterior.vencimiento || '';
    if (controlaVenc) {
      const fecha = prompt(
        `Fecha de vencimiento del lote de ${p.nombre}:\n\nFormato: AAAA-MM-DD`,
        fechaVenc || ''
      );
      if (fecha === null) return;
      if (fecha.trim()) {
        const fechaObj = new Date(fecha);
        if (!isNaN(fechaObj.getTime())) {
          fechaVenc = fecha.trim();
        }
      } else {
        fechaVenc = '';
      }
    }
    
    lineasAgregadas[indexEditando] = {
      id_producto: p.id,
      nombre: p.nombre,
      unidad: p.unidad_base || 'Unidad',
      cantidad: Number(cant),
      precio: precioNum,
      vencimiento: fechaVenc
    };
  }
  
  indexEditando = -1;
  renderizarLineas();
}

function renderizarLineas() {
  const cont = document.getElementById('lista-lineas');
  if (lineasAgregadas.length === 0) {
    cont.innerHTML = '<p style="text-align: center; color: var(--suave); font-size: 14px;">No hay productos agregados.</p>';
    return;
  }

  cont.innerHTML = '';
  lineasAgregadas.forEach((l, index) => {
    const div = document.createElement('div');
    div.className = 'linea';

    if (!l.id_producto) {
      // PENDIENTE
      div.style.borderLeft = '4px solid #EF4444';
      div.style.paddingLeft = '12px';
      div.style.background = 'rgba(239, 68, 68, 0.05)';
      div.style.borderRadius = '4px';
      div.onclick = () => abrirBuscadorParaReemplazar(index);
      div.innerHTML = `
        <div class="linea-info">
          <h4 style="color:#EF4444;">${l.nombre} (No reconocido)</h4>
          <p>Toca aquí para asignarle un producto del catálogo</p>
        </div>
        <button class="btn-eliminar" onclick="event.stopPropagation(); eliminarLinea(${index})">×</button>
      `;
    } else {
      // RECONOCIDO
      const precioTexto = l.precio ? ' · $' + Number(l.precio).toLocaleString('es-CO') + ' c/u' : ' · Sin precio';
      const vencTexto = l.vencimiento ? ' · 📅 Vence: ' + l.vencimiento : '';
      div.innerHTML = `
        <div class="linea-info" onclick="editarLinea(${index})">
          <h4>${l.nombre} <span class="badge-unidad">${l.unidad}</span></h4>
          <p>${l.cantidad} ${l.unidad.toLowerCase()}(s)${precioTexto}${vencTexto} (Toca para editar)</p>
        </div>
        <button class="btn-eliminar" onclick="event.stopPropagation(); eliminarLinea(${index})">×</button>
      `;
    }
    cont.appendChild(div);
  });
}

function editarCantidad(index) {
  const actual = lineasAgregadas[index].cantidad;
  const nueva = prompt(`Editar cantidad de ${lineasAgregadas[index].nombre}:`, actual);
  if (nueva !== null && nueva !== '' && !isNaN(nueva)) {
    lineasAgregadas[index].cantidad = Number(nueva);
    renderizarLineas();
  }
}
function editarLinea(index) {
  const l = lineasAgregadas[index];
  
  // Editar cantidad
  const nuevaCant = prompt(`Cantidad de ${l.nombre}:`, l.cantidad);
  if (nuevaCant === null || nuevaCant === '' || isNaN(nuevaCant)) return;
  
  // Editar precio
  const nuevoPrecio = prompt(
    `Precio de compra unitario de ${l.nombre}:\n\n(Deja vacío si no lo sabes)`,
    l.precio || ''
  );
  if (nuevoPrecio === null) return;
  
  // Editar fecha de vencimiento si aplica
  let nuevaFecha = l.vencimiento || '';
  const productoOriginal = productos.find(function(p) { return p.id === l.id_producto; });
  const controlaVenc = productoOriginal && productoOriginal.controla_vencimiento === true;
  
  if (controlaVenc) {
    const fecha = prompt(
      `Fecha de vencimiento de ${l.nombre} (AAAA-MM-DD):\n\n(Deja vacío si no la sabes)`,
      l.vencimiento || ''
    );
    if (fecha === null) return;
    if (fecha.trim()) {
      const fechaObj = new Date(fecha);
      if (!isNaN(fechaObj.getTime())) {
        nuevaFecha = fecha.trim();
      }
    } else {
      nuevaFecha = '';
    }
  }
  
  lineasAgregadas[index].cantidad = Number(nuevaCant);
  lineasAgregadas[index].precio = nuevoPrecio && !isNaN(nuevoPrecio) ? Number(nuevoPrecio) : '';
  lineasAgregadas[index].vencimiento = nuevaFecha;
  
  renderizarLineas();
}
function eliminarLinea(index) {
  lineasAgregadas.splice(index, 1);
  renderizarLineas();
}

async function guardarEntrada() {
  const factura = document.getElementById('factura').value.trim();
  const proveedor = document.getElementById('proveedor').value;

  if (!factura) return alert('Escribe el número de factura');
  if (!proveedor) return alert('Selecciona un proveedor');
  if (lineasAgregadas.length === 0) return alert('Agrega al menos un producto');

  const btn = document.getElementById('btn-guardar');
  btn.textContent = 'Guardando...';
  btn.disabled = true;

  const datos = {
    factura: factura,
    proveedor: proveedor,
    fecha: new Date().toISOString().split('T')[0],
    lineas: lineasAgregadas
  };

  try {
    const r = await apiPost({ accion: 'guardar_entrada', datos: datos });
    if (r.ok) {
      let mensaje = '¡Recepción guardada con éxito!\nID: ' + r.id_entrada;
      
      // Alertas de devoluciones pendientes
      if (r.alertas_devolucion && r.alertas_devolucion.length > 0) {
        mensaje += '\n\n🔄 ¡ATENCIÓN! Devoluciones pendientes:';
        r.alertas_devolucion.forEach(function(a) {
          mensaje += '\n\n📦 ' + a.nombre_producto;
          mensaje += '\n   • Devolución: ' + a.id_devolucion;
          mensaje += '\n   • Cantidad que acabas de recibir: ' + a.cantidad_entrada;
          mensaje += '\n   • Cantidad pendiente de cambio: ' + a.cantidad_pendiente;
          if (a.observacion) mensaje += '\n   • Obs: ' + a.observacion;
          mensaje += '\n\n👉 Verifica si este ingreso corresponde al cambio solicitado.';
        });
      }
      
      // Alertas de vencimiento
      if (r.alertas_vencimiento && r.alertas_vencimiento.length > 0) {
        mensaje += '\n\n⏰ Productos próximos a vencer:';
        r.alertas_vencimiento.forEach(function(a) {
          mensaje += '\n• ' + a.nombre + ' — vence en ' + a.dias + ' días';
        });
      }
      
      alert(mensaje);
      location.reload();
    } else {
      alert('Error: ' + r.error);
    }
  } catch (err) {
    alert('Error de conexión: ' + err.message);
  } finally {
    btn.textContent = 'Guardar Recepción';
    btn.disabled = false;
  }
}

// --- MÓDULO DE VOZ ---
let reconocimientoVoz = null;
let dictadoActivo = false;
let textoCapturado = '';

function iniciarDictado() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('Tu navegador no soporta dictado por voz. Usa Chrome.');
    return;
  }

  const btn = document.getElementById('btn-microfono');
  const estado = document.getElementById('estado');

  if (dictadoActivo && reconocimientoVoz) {
    reconocimientoVoz.stop();
    return;
  }

  textoCapturado = '';
  reconocimientoVoz = new SpeechRecognition();
  reconocimientoVoz.lang = 'es-CO';
  reconocimientoVoz.continuous = false;
  reconocimientoVoz.interimResults = false;
  reconocimientoVoz.maxAlternatives = 1;

  reconocimientoVoz.onstart = function() {
    dictadoActivo = true;
    btn.style.background = '#EF4444';
    btn.textContent = '⏹️';
    estado.className = 'ok';
    estado.textContent = '🎤 Escuchando... Habla claro y espera.';
    estado.style.display = 'block';
  };

  reconocimientoVoz.onresult = function(event) {
    if (event.results && event.results[0] && event.results[0][0]) {
      textoCapturado = event.results[0][0].transcript || '';
      estado.textContent = '📝 Capturado: "' + textoCapturado + '"';
    }
  };

  reconocimientoVoz.onerror = function(event) {
    dictadoActivo = false;
    btn.style.background = '';
    btn.textContent = '🎤';
    estado.className = 'error';
    estado.textContent = 'Error de micrófono: ' + event.error;
  };

  reconocimientoVoz.onend = async function() {
    dictadoActivo = false;
    btn.style.background = '';
    btn.textContent = '🎤';

    if (!textoCapturado || textoCapturado.trim() === '') {
      estado.className = 'error';
      estado.textContent = '⚠️ No se captó audio. Intenta de nuevo.';
      return;
    }

    estado.className = 'ok';
    estado.textContent = '📝 Dijiste: "' + textoCapturado + '"\nProcesando...';

    try {
      const proveedor = document.getElementById('proveedor').value;
      const r = await apiPost({
        accion: 'parsear_texto',
        texto: textoCapturado,
        id_proveedor: proveedor
      }, 60);

      if (!r.ok) throw new Error(r.error || 'No se pudo interpretar');

      (r.lineas || []).forEach(l => {
        const match = productos.find(p => p.id === l.id_producto);
        lineasAgregadas.push({
          id_producto: l.id_producto,
          nombre: l.nombre,
          unidad: match ? (match.unidad_base || l.unidad || 'Unidad') : (l.unidad || 'Unidad'),
          cantidad: l.cantidad,
          precio: l.precio || ''
        });
      });

      renderizarLineas();

      let msg = '📝 Tú dijiste: "' + (r.texto_recibido || textoCapturado) + '"\n\n';
      msg += '🤖 Gemini entendió:\n';
      (r.gemini_dijo && r.gemini_dijo.lineas ? r.gemini_dijo.lineas : []).forEach(function(l) {
        msg += '  • ' + l.descripcion + ' (' + l.cantidad + ' ' + l.unidad + ')\n';
      });
      msg += '\n🔍 Resultado:\n';
      (r.diagnostico || []).forEach(function(d) { msg += '  ' + d + '\n'; });
      msg += '\n✅ Se agregaron ' + (r.lineas || []).length + ' producto(s).';
      alert(msg);
      estado.style.display = 'none';
    } catch (err) {
      estado.className = 'error';
      estado.textContent = 'Error: ' + err.message;
    }
  };

  reconocimientoVoz.start();
}

function confirmarVolverEntrada() {
  const hayLineas = (typeof lineasAgregadas !== 'undefined') && lineasAgregadas.length > 0;
  const factura = document.getElementById('factura');
  const hayFactura = factura && factura.value.trim() !== '';
  if (hayLineas || hayFactura) {
    const salir = confirm('⚠️ Tienes datos sin guardar en esta recepción.\n\n¿Deseas salir sin guardar?');
    if (!salir) return false;
  }
  return true;
}

function limpiarEntrada() {
  if (lineasAgregadas.length === 0 && !document.getElementById('factura').value) {
    return alert('No hay datos para limpiar.');
  }
  if (confirm('¿Seguro que quieres borrar todos los productos de la lista?')) {
    lineasAgregadas = [];
    document.getElementById('factura').value = '';
    document.getElementById('proveedor').value = '';
    renderizarLineas();
    alert('✅ Lista limpiada.');
  }
}
// ============================================
// PESTAÑAS
// ============================================

function cambiarTabRecepcion(tab) {
  document.getElementById('tab-nueva-btn').classList.remove('active');
  document.getElementById('tab-hist-btn').classList.remove('active');
  document.getElementById('tab-nueva').classList.remove('active');
  document.getElementById('tab-historial').classList.remove('active');
  
  if (tab === 'nueva') {
    document.getElementById('tab-nueva-btn').classList.add('active');
    document.getElementById('tab-nueva').classList.add('active');
  } else {
    document.getElementById('tab-hist-btn').classList.add('active');
    document.getElementById('tab-historial').classList.add('active');
    cargarHistorial();
  }
}

// ============================================
// HISTORIAL
// ============================================

let proveedoresCargados = false;

async function cargarHistorial() {
  const lista = document.getElementById('hist-lista');
  if (!lista) return;
  lista.innerHTML = '<p style="text-align: center; color: var(--suave); font-size: 14px;">Cargando historial...</p>';
  
  if (!proveedoresCargados) {
    try {
      const r = await apiPost({ accion: 'listar_proveedores' }, 30);
      if (r.ok && r.items) {
        const select = document.getElementById('hist-proveedor');
        r.items.forEach(function(p) {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.nombre;
          select.appendChild(opt);
        });
      }
      proveedoresCargados = true;
    } catch (e) { console.error('Error cargando proveedores:', e); }
  }
  
  const filtros = {
    busqueda: document.getElementById('hist-busqueda') ? document.getElementById('hist-busqueda').value : '',
    fecha_desde: document.getElementById('hist-fecha-desde') ? document.getElementById('hist-fecha-desde').value : '',
    fecha_hasta: document.getElementById('hist-fecha-hasta') ? document.getElementById('hist-fecha-hasta').value : '',
    proveedor: document.getElementById('hist-proveedor') ? document.getElementById('hist-proveedor').value : ''
  };
  
  try {
    const r = await apiPost({ accion: 'listar_recepciones', filtros: filtros }, 60);
    if (!r.ok) throw new Error(r.error || 'Error al cargar');
    
    if (!r.recepciones || r.recepciones.length === 0) {
      lista.innerHTML = '<p style="text-align: center; color: var(--suave); font-size: 14px; padding: 20px;">No hay recepciones registradas.</p>';
      return;
    }
    
    let html = '<p style="text-align: center; color: var(--suave); font-size: 12px; margin-bottom: 8px;">' + r.recepciones.length + ' recepción(es)</p>';
    
    r.recepciones.forEach(function(rec) {
      const fecha = rec.fecha ? formatearFecha(rec.fecha) : 'Sin fecha';
      const proveedor = rec.proveedor_nombre || 'Sin proveedor';
      const factura = rec.factura || 'Sin factura';
      const total = '$' + rec.total.toLocaleString('es-CO');
      
      html += '<div class="hist-item" onclick="verDetalleRecepcion(\'' + rec.id + '\')">' +
        '<div class="hist-item-header">' +
          '<h4>' + fecha + '</h4>' +
          '<span class="total">' + total + '</span>' +
        '</div>' +
        '<p>' + proveedor + ' · ' + factura + '</p>' +
        '<p><span class="badge">' + rec.numProductos + ' producto(s)</span></p>' +
      '</div>';
    });
    
    lista.innerHTML = html;
  } catch (err) {
    lista.innerHTML = '<p style="text-align: center; color: var(--peligro); font-size: 14px;">Error: ' + err.message + '</p>';
  }
}

function formatearFecha(fecha) {
  if (!fecha) return '';
  const d = new Date(fecha);
  const dia = String(d.getDate()).padStart(2, '0');
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const año = d.getFullYear();
  const hora = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  return dia + '/' + mes + '/' + año + ' ' + hora + ':' + min;
}

async function verDetalleRecepcion(idEntrada) {
  const modal = document.getElementById('modal-detalle');
  const contenido = document.getElementById('detalle-contenido');
  contenido.innerHTML = '<p style="text-align: center; color: var(--suave);">Cargando...</p>';
  modal.classList.add('open');
  
  try {
    const r = await apiPost({ accion: 'detalle_recepcion', id_entrada: idEntrada }, 30);
    if (!r.ok) throw new Error(r.error);
    
    const rec = r.recepcion;
    const fecha = rec.fecha ? formatearFecha(rec.fecha) : 'Sin fecha';
    
    let html = '<div style="margin-bottom: 16px;">' +
      '<p style="font-size: 13px; color: var(--suave);">Fecha: <strong style="color: var(--texto);">' + fecha + '</strong></p>' +
      '<p style="font-size: 13px; color: var(--suave);">Proveedor: <strong style="color: var(--texto);">' + (rec.proveedor_nombre || '—') + '</strong></p>' +
      '<p style="font-size: 13px; color: var(--suave);">Factura: <strong style="color: var(--texto);">' + (rec.factura || '—') + '</strong></p>' +
    '</div>' +
    '<div style="border-top: 1px solid var(--borde); padding-top: 12px;">';
    
    rec.productos.forEach(function(p) {
      html += '<div class="detalle-producto">' +
        '<div class="detalle-producto-info">' +
          '<h5>' + p.nombre + '</h5>' +
          '<p>' + p.cantidad + ' ' + p.unidad.toLowerCase() + ' × $' + p.precio_unitario.toLocaleString('es-CO') + '</p>' +
        '</div>' +
        '<div class="detalle-producto-total">' +
          '<strong>$' + p.subtotal.toLocaleString('es-CO') + '</strong>' +
        '</div>' +
      '</div>';
    });
    
    html += '</div>' +
      '<div style="border-top: 2px solid var(--acento); margin-top: 12px; padding-top: 12px; display: flex; justify-content: space-between; font-size: 16px; font-weight: bold;">' +
        '<span>Total</span>' +
        '<span style="color: var(--acento);">$' + rec.total.toLocaleString('es-CO') + '</span>' +
      '</div>';
    
    contenido.innerHTML = html;
  } catch (err) {
    contenido.innerHTML = '<p style="color: var(--peligro);">Error: ' + err.message + '</p>';
  }
}

function cerrarDetalle() {
  document.getElementById('modal-detalle').classList.remove('open');
}
