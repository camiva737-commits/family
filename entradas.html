<style>
  .tabs { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--borde); box-shadow: var(--shadow-1); }
  .tabs button { flex: 1; padding: 12px; border: none; border-radius: 10px; background: transparent; color: var(--suave); font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; font-family: inherit; }
  .tabs button.active { background: var(--acento); color: #FFF; box-shadow: 0 2px 8px rgba(242, 140, 0, 0.3); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .input-camara-group { display: flex; gap: 8px; align-items: stretch; margin-bottom: 12px; }
  .input-camara-group input { margin-bottom: 0; flex: 1; min-width: 0; }
  .btn-camara { padding: 0 14px; border-radius: var(--radius-input); background: var(--acento); border: none; font-size: 18px; color: #FFF; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.15s; }
  .btn-camara:hover { background: var(--acento-2); }
  .btn-camara:active { transform: scale(0.95); }
  .btn-camara:disabled { opacity: 0.5; cursor: not-allowed; }
  .linea { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--borde); cursor: pointer; }
  .linea:last-child { border-bottom: none; }
  .linea-info { flex: 1; min-width: 0; }
  .linea-info h4 { font-size: 14px; font-weight: 700; color: var(--texto); margin-bottom: 4px; }
  .linea-info p { font-size: 12px; color: var(--suave); margin-top: 4px; }
  .badge-unidad { display: inline-block; background: var(--acento-suave); padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: 700; margin-left: 6px; color: var(--primario); }
  .btn-eliminar { background: none; border: none; color: var(--peligro); font-size: 20px; cursor: pointer; padding: 5px; line-height: 1; }
  .linea-pendiente { border-left: 4px solid var(--peligro); padding: 12px; background: var(--peligro-bg); border-radius: 8px; cursor: pointer; }
  .linea-pendiente h4 { color: var(--peligro); font-size: 14px; font-weight: 700; }
  .linea-pendiente p { color: var(--suave); font-size: 12px; }
  #buscador-wrapper { display: none; background: var(--bg); position: sticky; top: 0; padding: 10px 0; z-index: 10; }
  .resultado { padding: 12px 14px; background: var(--card); border-bottom: 1px solid var(--borde); cursor: pointer; transition: 0.1s; }
  .resultado:hover { background: var(--input-hover); }
  .resultado:active { background: var(--input); }
  .hist-filtros { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hist-filtros input, .hist-filtros select { margin-bottom: 0; padding: 10px 14px; font-size: 13px; }
  .hist-item { background: var(--card); border: 1px solid var(--borde); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-1); transition: 0.15s; }
  .hist-item:hover { transform: translateX(2px); box-shadow: var(--shadow-2); }
  .hist-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
  .hist-item-header h4 { font-size: 14px; font-weight: 700; color: var(--texto); margin: 0; }
  .hist-item-header .total { font-size: 15px; font-weight: 800; color: var(--acento); white-space: nowrap; }
  .hist-item p { font-size: 12px; color: var(--suave); margin: 3px 0; }
  .hist-item .badge { display: inline-block; background: var(--acento-suave); color: var(--primario); padding: 3px 10px; border-radius: 9999px; font-size: 10px; font-weight: 700; }
  .modal-detalle { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-detalle.open { display: flex; }
  .modal-detalle-content { background: var(--card); border-radius: 16px; max-width: 500px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-3); border: 1px solid var(--borde); }
  .modal-detalle-header { padding: 16px; background: var(--input); border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: center; }
  .modal-detalle-header h3 { font-size: 16px; font-weight: 700; color: var(--texto); margin: 0; }
  .modal-detalle-header button { background: none; border: none; color: var(--suave); font-size: 22px; cursor: pointer; line-height: 1; }
  .modal-detalle-body { padding: 16px; overflow-y: auto; }
  .detalle-producto { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--borde); }
  .detalle-producto:last-child { border-bottom: none; }
  .detalle-producto-info h5 { font-size: 14px; font-weight: 700; margin: 0 0 2px 0; color: var(--texto); }
  .detalle-producto-info p { font-size: 12px; color: var(--suave); margin: 0; }
  .detalle-producto-total { text-align: right; font-size: 13px; font-weight: 600; }
  .detalle-producto-total strong { color: var(--acento); font-weight: 800; }
  .modal-prov { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-prov.open { display: flex; }
  .modal-prov-content { background: var(--card); border-radius: 18px; max-width: 460px; width: 100%; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid var(--borde); box-shadow: var(--shadow-3); }
  .modal-prov-header { padding: 16px; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: center; background: var(--input); border-radius: 18px 18px 0 0; }
  .modal-prov-header h3 { font-size: 16px; font-weight: 700; color: var(--texto); margin: 0; }
  .modal-prov-header button { background: none; border: none; color: var(--suave); font-size: 22px; cursor: pointer; line-height: 1; }
  .modal-prov-body { padding: 16px; overflow-y: auto; }
  .modal-prov-body label { display: block; font-size: 12px; color: var(--suave); margin-bottom: 6px; font-weight: 700; letter-spacing: 0.02em; margin-top: 12px; }
  .modal-prov-body label:first-child { margin-top: 0; }
  .modal-prov-body input { margin-bottom: 0; }
  .modal-prov-footer { padding: 12px 16px; border-top: 1px solid var(--borde); display: flex; gap: 10px; background: var(--input); border-radius: 0 0 18px 18px; }
  .modal-prov-footer button { flex: 1; padding: 14px; border-radius: var(--radius-input); border: none; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-cancelar-prov { background: var(--card); color: var(--suave); border: 1px solid var(--borde); }
  .btn-guardar-prov { background: var(--acento-2); color: #FFF; }
  .btn-guardar-prov:hover { background: var(--acento); }
  .btn-guardar-prov:disabled { opacity: 0.5; cursor: not-allowed; }
  #modal-recorte { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
</style>

<script>
let productos = [];
let lineasAgregadas = [];
let indexEditando = -1;

(async function () {
  try {
    const r = await apiGet('accion=inventario');
    if (!r.ok) throw new Error(r.error);
    productos = r.items;
  } catch (err) {
    mostrarMensaje('Error al cargar catálogo: ' + err.message, 'error');
  }
  await cargarProveedores();
})();

function mostrarMensaje(msg, tipo) {
  const el = document.getElementById('estado');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.padding = '14px';
  el.style.borderRadius = '12px';
  el.style.textAlign = 'center';
  el.style.fontWeight = '700';
  el.style.fontSize = '14px';
  el.style.marginBottom = '16px';
  
  if (tipo === 'ok') {
    el.style.background = 'var(--ok-bg)';
    el.style.color = 'var(--ok)';
    el.style.border = '1px solid var(--ok)';
  } else if (tipo === 'error') {
    el.style.background = 'var(--peligro-bg)';
    el.style.color = 'var(--peligro)';
    el.style.border = '1px solid var(--peligro)';
  } else {
    el.style.background = 'var(--warning-bg)';
    el.style.color = 'var(--warning)';
    el.style.border = '1px solid var(--warning)';
  }
}

async function cargarProveedores() {
  try {
    const r = await apiPost({ accion: 'listar_proveedores_completo' }, 30);
    if (!r.ok) throw new Error(r.error || 'No se pudieron cargar los proveedores');
    const select = document.getElementById('proveedor');
    const seleccionado = select.value;
    select.innerHTML = '<option value="">Seleccione Proveedor...</option>';
    (r.items || []).forEach(function (p) {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.nombre + (p.numero ? ' (' + p.numero + ')' : '');
      select.appendChild(opt);
    });
    if (seleccionado) select.value = seleccionado;
  } catch (err) {
    console.error('Error cargando proveedores:', err);
  }
}

let cropper = null;
let inputFotoActual = null;

async function procesarFotoIA(input) {
  const file = input.files[0];
  if (!file) return;
  
  inputFotoActual = input;
  const modal = document.getElementById('modal-recorte');
  const img = document.getElementById('imagen-a-recortar');
  const url = URL.createObjectURL(file);
  img.src = url;
  modal.style.display = 'flex';
  
  img.onload = function() {
    if (cropper) cropper.destroy();
    cropper = new Cropper(img, { viewMode: 1, autoCropArea: 0.9, background: false, responsive: true, guides: true, movable: true, zoomable: true, scalable: false, rotatable: false });
  };
}

function cancelarRecorte() {
  const modal = document.getElementById('modal-recorte');
  modal.style.display = 'none';
  if (cropper) { cropper.destroy(); cropper = null; }
  if (inputFotoActual) { inputFotoActual.value = ''; }
}

async function usarImagenCompleta() {
  const modal = document.getElementById('modal-recorte');
  const img = document.getElementById('imagen-a-recortar');
  modal.style.display = 'none';
  if (cropper) { cropper.destroy(); cropper = null; }
  await enviarFotoIA(img.src, true);
  if (inputFotoActual) { inputFotoActual.value = ''; }
}

async function aplicarRecorte() {
  if (!cropper) return;
  const modal = document.getElementById('modal-recorte');
  const canvasOriginal = cropper.getCroppedCanvas({ maxWidth: 2400, maxHeight: 2400, imageSmoothingQuality: 'high' });
  const canvasMejorado = document.createElement('canvas');
  canvasMejorado.width = canvasOriginal.width;
  canvasMejorado.height = canvasOriginal.height;
  const ctx = canvasMejorado.getContext('2d');
  ctx.filter = 'contrast(1.3) brightness(1.1) grayscale(0.2)';
  ctx.drawImage(canvasOriginal, 0, 0);
  const dataUrl = canvasMejorado.toDataURL('image/jpeg', 0.92);
  modal.style.display = 'none';
  if (cropper) { cropper.destroy(); cropper = null; }
  await enviarFotoIA(dataUrl, false);
  if (inputFotoActual) { inputFotoActual.value = ''; }
}

async function enviarFotoIA(dataUrl, esCompleta) {
  const botones = document.querySelectorAll('.btn-camara');
  botones.forEach(b => { b.disabled = true; });
  mostrarMensaje((esCompleta ? 'Enviando imagen completa' : 'Enviando recorte') + ' a la IA... (puede tardar unos segundos)', 'aviso');
  
  try {
    const r = await apiPost({ accion: 'escanear_ia', base64: dataUrl }, 90);
    if (!r.ok) throw new Error(r.error || 'No se pudo leer la factura');
    if (r.factura && document.getElementById('factura')) document.getElementById('factura').value = r.factura;
    
    (r.lineas || []).forEach(l => {
      const match = productos.find(p => p.id === l.id_producto);
      lineasAgregadas.push({
        id_producto: l.id_producto,
        nombre: l.nombre,
        unidad: match ? (match.unidad_base || l.unidad || 'Unidad') : (l.unidad || 'Unidad'),
        cantidad: l.cantidad,
        precio: l.precio || '',
        stock_sistema: match ? (match.stock_actual || 0) : 0
      });
    });
    
    (r.sin_coincidencia || []).forEach(nombreOriginal => {
      lineasAgregadas.push({ id_producto: null, nombre: nombreOriginal, unidad: 'Pendiente', cantidad: 1, stock_sistema: 0 });
    });
    
    if (typeof renderizarLineas === 'function') renderizarLineas();
    
    let msg = 'Factura leída. Productos agregados: ' + (r.lineas || []).length + '.';
    if (r.sin_coincidencia && r.sin_coincidencia.length) msg += '\n\nNo reconocí estos, agrégalos manualmente:\n- ' + r.sin_coincidencia.join('\n- ');
    alert(msg);
    document.getElementById('estado').style.display = 'none';
  } catch (err) {
    mostrarMensaje('Error: ' + err.message, 'error');
  } finally {
    botones.forEach(b => { b.disabled = false; });
  }
}

function abrirBuscador(index) {
  indexEditando = (typeof index === 'number') ? index : -1;
  document.getElementById('buscador-wrapper').style.display = 'block';
  document.getElementById('input-buscar').focus();
}

function abrirBuscadorParaReemplazar(index) { abrirBuscador(index); }

function cerrarBuscador() {
  document.getElementById('buscador-wrapper').style.display = 'none';
  document.getElementById('input-buscar').value = '';
  document.getElementById('resultados-busqueda').innerHTML = '';
}

function filtrar() {
  const q = document.getElementById('input-buscar').value.toLowerCase();
  const cont = document.getElementById('resultados-busqueda');
  cont.innerHTML = '';
  if (q.length < 2) return;

  productos.filter(p => (p.id + ' ' + p.nombre).toLowerCase().includes(q)).slice(0, 10).forEach(p => {
    const d = document.createElement('div');
    d.className = 'resultado';
    d.innerHTML = `<strong>${p.nombre}</strong> <span style="color:var(--suave);font-size:12px;">(${p.id})</span>`;
    d.onclick = () => agregarLinea(p);
    cont.appendChild(d);
  });
}

function agregarLinea(p) {
  cerrarBuscador();
  const controlaVenc = p.controla_vencimiento === true;
  
  if (indexEditando === -1) {
    const cant = prompt(`¿Cuántas unidades de ${p.nombre} llegaron?`);
    if (!cant || isNaN(cant)) return;
    const precio = prompt(`¿A qué precio de compra llegó cada ${(p.unidad_base || 'Unidad').toLowerCase()} de ${p.nombre}?\n\n(Ej: 1811)`);
    if (precio === null) return;
    const precioNum = precio && !isNaN(precio) ? Number(precio) : '';
    
    let fechaVenc = '';
    if (controlaVenc) {
      const fecha = prompt(`Este producto controla vencimiento.\n\n¿Cuál es la FECHA DE VENCIMIENTO del lote?\n\nFormato: AAAA-MM-DD (ej: 2027-03-15)\n\n(Deja vacío si no la sabes)`);
      if (fecha && fecha.trim()) {
        const fechaObj = new Date(fecha);
        if (!isNaN(fechaObj.getTime())) fechaVenc = fecha.trim();
        else alert('Fecha inválida. Se guardará sin fecha de vencimiento.');
      }
    }
    
    lineasAgregadas.push({
      id_producto: p.id, nombre: p.nombre, unidad: p.unidad_base || 'Unidad',
      cantidad: Number(cant), precio: precioNum, vencimiento: fechaVenc
    });
  } else {
    const anterior = lineasAgregadas[indexEditando];
    if (!anterior.id_producto) {
      const confirmarTexto = confirm(`La IA leyó: "${anterior.nombre}"\n\n¿Es correcto este texto en la factura?\n\n• Aceptar = Sí, es correcto\n• Cancelar = No, era otro texto`);
      if (confirmarTexto) {
        apiPost({ accion: 'guardar_alias', alias: anterior.nombre, id_producto: p.id }).then(r => console.log('✅ Alias guardado:', r));
      } else {
        const textoReal = prompt(`¿Cuál era el texto REAL en la factura? (escríbelo tal cual aparecía)`, '');
        if (textoReal && textoReal.trim()) {
          apiPost({ accion: 'guardar_alias', alias: textoReal.trim(), id_producto: p.id }).then(r => console.log('✅ Alias correcto guardado:', r));
        }
      }
    }
    
    const cant = prompt(`¿Cuántas unidades de ${p.nombre}?`, anterior.cantidad || 1);
    if (!cant || isNaN(cant)) return;
    const precio = prompt(`¿A qué precio de compra llegó cada ${(p.unidad_base || 'Unidad').toLowerCase()} de ${p.nombre}?`, anterior.precio || '');
    if (precio === null) return;
    const precioNum = precio && !isNaN(precio) ? Number(precio) : '';
    
    let fechaVenc = anterior.vencimiento || '';
    if (controlaVenc) {
      const fecha = prompt(`Fecha de vencimiento del lote de ${p.nombre}:\n\nFormato: AAAA-MM-DD`, fechaVenc || '');
      if (fecha === null) return;
      if (fecha.trim()) {
        const fechaObj = new Date(fecha);
        if (!isNaN(fechaObj.getTime())) fechaVenc = fecha.trim();
      } else fechaVenc = '';
    }
    
    lineasAgregadas[indexEditando] = {
      id_producto: p.id, nombre: p.nombre, unidad: p.unidad_base || 'Unidad',
      cantidad: Number(cant), precio: precioNum, vencimiento: fechaVenc
    };
  }
  
  indexEditando = -1;
  renderizarLineas();
}

function renderizarLineas() {
  const cont = document.getElementById('lista-lineas');
  if (lineasAgregadas.length === 0) {
    cont.innerHTML = '<p style="text-align: center; color: var(--suave); font-size: 14px;">No hay productos agregados.</p>';
    return;
  }

  cont.innerHTML = '';
  lineasAgregadas.forEach((l, index) => {
    const div = document.createElement('div');
    div.className = 'linea';

    if (!l.id_producto) {
      div.className = 'linea-pendiente';
      div.onclick = () => abrirBuscadorParaReemplazar(index);
      div.innerHTML = `<div class="linea-info"><h4>${l.nombre} (No reconocido)</h4><p>Toca aquí para asignarle un producto del catálogo</p></div><button class="btn-eliminar" onclick="event.stopPropagation(); eliminarLinea(${index})">×</button>`;
    } else {
      const precioTexto = l.precio ? ' · $' + Number(l.precio).toLocaleString('es-CO') + ' c/u' : ' · Sin precio';
      const vencTexto = l.vencimiento ? ' · 📅 Vence: ' + l.vencimiento : '';
      div.innerHTML = `<div class="linea-info" onclick="editarLinea(${index})"><h4>${l.nombre} <span class="badge-unidad">${l.unidad}</span></h4><p>${l.cantidad} ${l.unidad.toLowerCase()}(s)${precioTexto}${vencTexto} (Toca para editar)</p></div><button class="btn-eliminar" onclick="event.stopPropagation(); eliminarLinea(${index})">×</button>`;
    }
    cont.appendChild(div);
  });
}

function editarLinea(index) {
  const l = lineasAgregadas[index];
  const nuevaCant = prompt(`Cantidad de ${l.nombre}:`, l.cantidad);
  if (nuevaCant === null || nuevaCant === '' || isNaN(nuevaCant)) return;
  const nuevoPrecio = prompt(`Precio de compra unitario de ${l.nombre}:\n\n(Deja vacío si no lo sabes)`, l.precio || '');
  if (nuevoPrecio === null) return;
  
  let nuevaFecha = l.vencimiento || '';
  const productoOriginal = productos.find(function(p) { return p.id === l.id_producto; });
  const controlaVenc = productoOriginal && productoOriginal.controla_vencimiento === true;
  
  if (controlaVenc) {
    const fecha = prompt(`Fecha de vencimiento de ${l.nombre} (AAAA-MM-DD):\n\n(Deja vacío si no la sabes)`, l.vencimiento || '');
    if (fecha === null) return;
    if (fecha.trim()) {
      const fechaObj = new Date(fecha);
      if (!isNaN(fechaObj.getTime())) nuevaFecha = fecha.trim();
    } else nuevaFecha = '';
  }
  
  lineasAgregadas[index].cantidad = Number(nuevaCant);
  lineasAgregadas[index].precio = nuevoPrecio && !isNaN(nuevoPrecio) ? Number(nuevoPrecio) : '';
  lineasAgregadas[index].vencimiento = nuevaFecha;
  renderizarLineas();
}

function eliminarLinea(index) {
  lineasAgregadas.splice(index, 1);
  renderizarLineas();
}

async function guardarEntrada() {

  if (!factura) return alert('Escribe el número de factura');

  const datos = {
    factura: factura, proveedor: proveedor,

    lineas: lineasAgregadas
  };

    const r = await apiPost({ accion: 'guardar_entrada', datos: datos });

let reconocimientoVoz = null;
let dictadoActivo = false;
let textoCapturado = '';

function iniciarDictado() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { alert('Tu navegador no soporta dictado por voz. Usa Chrome.'); return; }
  const btn = document.getElementById('btn-microfono');
  if (dictadoActivo && reconocimientoVoz) { reconocimientoVoz.stop(); return; }
  
  textoCapturado = '';
  reconocimientoVoz = new SpeechRecognition();
  reconocimientoVoz.lang = 'es-CO';
  reconocimientoVoz.continuous = false;
  reconocimientoVoz.interimResults = false;
  reconocimientoVoz.maxAlternatives = 1;

  reconocimientoVoz.onstart = function() {
    dictadoActivo = true;
    btn.style.background = 'var(--peligro)';
    btn.textContent = '⏹️';
    mostrarMensaje('🎤 Escuchando... Habla claro y espera.', 'ok');
  };
  reconocimientoVoz.onresult = function(event) {
    if (event.results && event.results[0] && event.results[0][0]) textoCapturado = event.results[0][0].transcript || '';
  };
  reconocimientoVoz.onerror = function(event) {
    dictadoActivo = false;
    btn.style.background = '';
    btn.textContent = '🎤';
    mostrarMensaje('Error de micrófono: ' + event.error, 'error');
  };
  reconocimientoVoz.onend = async function() {
    dictadoActivo = false;
    btn.style.background = '';
    btn.textContent = '🎤';
    if (!textoCapturado || textoCapturado.trim() === '') {
      mostrarMensaje('⚠️ No se captó audio. Intenta de nuevo.', 'error');
      return;
    }
    mostrarMensaje('📝 Procesando: "' + textoCapturado + '"...', 'aviso');
    try {
      const proveedor = document.getElementById('proveedor').value;
      const r = await apiPost({ accion: 'parsear_texto', texto: textoCapturado, id_proveedor: proveedor }, 60);
      if (!r.ok) throw new Error(r.error || 'No se pudo interpretar');
      (r.lineas || []).forEach(l => {
        const match = productos.find(p => p.id === l.id_producto);
        lineasAgregadas.push({
          id_producto: l.id_producto, nombre: l.nombre,
          unidad: match ? (match.unidad_base || l.unidad || 'Unidad') : (l.unidad || 'Unidad'),
          cantidad: l.cantidad, precio: l.precio || ''
        });
      });
      renderizarLineas();
      let msg = '📝 Tú dijiste: "' + (r.texto_recibido || textoCapturado) + '"\n\n';
      msg += '🤖 Gemini entendió:\n';
      (r.gemini_dijo && r.gemini_dijo.lineas ? r.gemini_dijo.lineas : []).forEach(function(l) { msg += '  • ' + l.descripcion + ' (' + l.cantidad + ' ' + l.unidad + ')\n'; });
      msg += '\n✅ Se agregaron ' + (r.lineas || []).length + ' producto(s).';
      alert(msg);
      document.getElementById('estado').style.display = 'none';
    } catch (err) {
      mostrarMensaje('Error: ' + err.message, 'error');
    }
  };
  reconocimientoVoz.start();
}

function confirmarVolverEntrada() {
  const hayLineas = (typeof lineasAgregadas !== 'undefined') && lineasAgregadas.length > 0;
  const factura = document.getElementById('factura');
  const hayFactura = factura && factura.value.trim() !== '';

    const salir = confirm('⚠️ Tienes datos sin guardar en esta recepción.\n\n¿Deseas salir sin guardar?');
    if (!salir) return false;
  }
  return true;
}

function limpiarEntrada() {

}

async function cargarHistorial() {
  const lista = document.getElementById('hist-lista');
  if (!lista) return;
  lista.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-text">Cargando historial...</div></div>';
  
  if (!proveedoresCargados) {
    try {
      const r = await apiPost({ accion: 'listar_proveedores' }, 30);
      if (r.ok && r.items) {
        const select = document.getElementById('hist-proveedor');
        r.items.forEach(function(p) {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.nombre;
          select.appendChild(opt);
        });
      }
      proveedoresCargados = true;
    } catch (e) { console.error('Error cargando proveedores:', e); }
  }
  
  const filtros = {
    busqueda: document.getElementById('hist-busqueda') ? document.getElementById('hist-busqueda').value : '',
    fecha_desde: document.getElementById('hist-fecha-desde') ? document.getElementById('hist-fecha-desde').value : '',
    fecha_hasta: document.getElementById('hist-fecha-hasta') ? document.getElementById('hist-fecha-hasta').value : '',
    proveedor: document.getElementById('hist-proveedor') ? document.getElementById('hist-proveedor').value : ''
  };
  
  try {
    const r = await apiPost({ accion: 'listar_recepciones', filtros: filtros }, 60);
    if (!r.ok) throw new Error(r.error || 'Error al cargar');
    if (!r.recepciones || r.recepciones.length === 0) {
      lista.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">No hay recepciones registradas.</div></div>';
      return;
    }
    let html = '<p style="text-align: center; color: var(--suave); font-size: 12px; margin-bottom: 12px;">' + r.recepciones.length + ' recepción(es)</p>';
    r.recepciones.forEach(function(rec) {
      const fecha = rec.fecha ? formatearFecha(rec.fecha) : 'Sin fecha';
      const proveedor = rec.proveedor_nombre || 'Sin proveedor';
      const factura = rec.factura || 'Sin factura';
      const total = '$' + rec.total.toLocaleString('es-CO');
      html += '<div class="hist-item" onclick="verDetalleRecepcion(\'' + rec.id + '\')"><div class="hist-item-header"><h4>' + fecha + '</h4><span class="total">' + total + '</span></div><p>' + proveedor + ' · ' + factura + '</p><p><span class="badge">' + rec.numProductos + ' producto(s)</span></p></div>';
    });
    lista.innerHTML = html;
  } catch (err) {
    lista.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-text" style="color: var(--peligro);">Error: ' + err.message + '</div></div>';
  }
}

function formatearFecha(fecha) {
  if (!fecha) return '';
  const d = new Date(fecha);
  const dia = String(d.getDate()).padStart(2, '0');
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const año = d.getFullYear();
  const hora = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  return dia + '/' + mes + '/' + año + ' ' + hora + ':' + min;
}
