<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Entradas · ArquiDulces</title>
<script src="comun.js?v=8"></script>
<style>
  :root {
    --bg: #0F111A; --card: #1A1D2D; --input: #25293D; --texto: #F8FAFC; 
    --suave: #94A3B8; --borde: #334155; --acento: #10B981; --peligro: #EF4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--texto); padding: 20px; padding-bottom: 50px; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 { font-size: 24px; color: var(--acento); font-weight: 800; }
  .btn-volver { background: none; border: none; color: var(--suave); font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; }

  #estado { padding: 14px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 16px; display: none; white-space: pre-line; }
  .ok { background: rgba(16, 185, 129, 0.2); color: var(--acento); border: 1px solid var(--acento); }
  .error { background: rgba(239, 68, 68, 0.2); color: var(--peligro); border: 1px solid var(--peligro); }

  input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--borde); background: var(--input); color: var(--texto); font-size: 16px; margin-bottom: 12px; outline: none; }
  
  .card { background: var(--card); padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--borde); }
  .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
  
  .linea { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--borde); cursor: pointer; }
  .linea:last-child { border-bottom: none; }
  .linea-info { flex: 1; }
  .linea-info h4 { font-size: 15px; }
  .linea-info p { font-size: 13px; color: var(--suave); margin-top: 4px; }
  .badge-unidad { display: inline-block; background: var(--borde); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-left: 6px; color: var(--texto); }
  .btn-eliminar { background: none; border: none; color: var(--peligro); font-size: 20px; cursor: pointer; padding: 5px; }

  .btn-primario { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--acento); color: #000; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
  .btn-primario:disabled { opacity: 0.6; }
  .btn-secundario { width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed var(--acento); background: transparent; color: var(--acento); font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }

  #buscador-wrapper { display: none; background: var(--bg); position: sticky; top: 0; padding: 10px 0; z-index: 10; }
  .resultado { padding: 12px; background: var(--card); border-bottom: 1px solid var(--borde); cursor: pointer; }
  .resultado:active { background: var(--input); }

  /* Botones de cámara y galería */
  .input-camara-group { display: flex; gap: 10px; align-items: stretch; margin-bottom: 12px; }
  .input-camara-group input { margin-bottom: 0; flex: 1; min-width: 0; }
  .btn-camara { padding: 0 16px; border-radius: 12px; background: var(--acento); border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-camara:disabled { opacity: 0.5; }
</style>
</head>
<body>

  <div class="header">
    <h1>Recepción</h1>
    <a href="index.html" class="btn-volver">← Volver</a>
  </div>

  <div id="estado" class="ok" style="display: block;">Cargando productos...</div>

  <div class="card">
    <div class="input-camara-group">
      <input type="text" id="factura" placeholder="Número de factura">
      <button class="btn-camara" title="Tomar foto de la factura" onclick="document.getElementById('fotoCamara').click()">📷</button>
      <button class="btn-camara" title="Elegir foto de la galería" onclick="document.getElementById('fotoGaleria').click()">🖼️</button>
    </div>
    <!-- Inputs ocultos: uno abre la cámara, el otro la galería -->
    <input type="file" id="fotoCamara" accept="image/*" capture="environment" style="display: none;" onchange="procesarFotoIA(this)">
    <input type="file" id="fotoGaleria" accept="image/*" style="display: none;" onchange="procesarFotoIA(this)">
    
    <select id="proveedor">
      <option value="">Seleccione Proveedor...</option>
      <option value="7314450-5">Distribuidora Jencar</option>
      <option value="9010515728.0">Dulces y Marcas S.A.S</option>
      <option value="7223562-0">Margarita</option>
      <option value="860020308-9">Comestibles Ricos S.A</option>
    </select>
  </div>

  <div id="lista-lineas" class="card">
    <p style="text-align: center; color: var(--suave); font-size: 14px;">No hay productos agregados.</p>
  </div>

  <button class="btn-secundario" onclick="abrirBuscador()">+ Agregar Producto Manualmente</button>
  <button class="btn-primario" id="btn-guardar" onclick="guardarEntrada()">Guardar Recepción</button>

  <!-- Buscador flotante -->
  <div id="buscador-wrapper">
    <input type="text" id="input-buscar" placeholder="Buscar producto..." oninput="filtrar()">
    <div id="resultados-busqueda" style="max-height: 300px; overflow-y: auto; border-radius: 12px; overflow: hidden;"></div>
    <button class="btn-volver" style="margin-top: 10px; color: var(--peligro);" onclick="cerrarBuscador()">Cancelar</button>
  </div>

<script>
let productos = [];
let lineasAgregadas = [];

// --- CARGA INICIAL DEL CATÁLOGO ---
(async function () {
  try {
    const r = await apiGet('accion=inventario');
    if (!r.ok) throw new Error(r.error);
    productos = r.items;
    document.getElementById('estado').style.display = 'none';
  } catch (err) {
    document.getElementById('estado').textContent = 'Error al cargar catálogo: ' + err.message;
    document.getElementById('estado').className = 'error';
  }
})();

// --- LECTURA DE FACTURA CON IA (FOTO POR POST) ---
async function procesarFotoIA(input) {
  const file = input.files[0];
  if (!file) return;

  const botones = document.querySelectorAll('.btn-camara');
  botones.forEach(b => { b.disabled = true; });

  const estado = document.getElementById('estado');
  estado.className = 'ok';
  estado.textContent = 'Leyendo factura con IA... (puede tardar unos segundos)';
  estado.style.display = 'block';

  try {
    const base64 = await comprimirImagen(file, 1200, 0.7);
    const r = await apiPost({ accion: 'escanear_ia', base64: base64 }, 90);

    if (!r.ok) throw new Error(r.error || 'No se pudo leer la factura');

    if (r.factura) document.getElementById('factura').value = r.factura;

    (r.lineas || []).forEach(l => {
      // Buscamos la info del catálogo para mostrarla en la lista
      const match = productos.find(p => p.id === l.id_producto);
      
      lineasAgregadas.push({
        id_producto: l.id_producto,
        nombre: l.nombre,
        unidad: match ? (match.unidad_base || 'Unidad') : 'Unidad', // Etiqueta verde
        cantidad: l.cantidad,
        precio: l.precio || ''
      });
    });
    renderizarLineas();

    let msg = 'Factura leída. Productos agregados: ' + (r.lineas || []).length + '.';
    if (r.sin_coincidencia && r.sin_coincidencia.length) {
      msg += '\n\nNo reconocí estos, agrégalos manualmente:\n- ' + r.sin_coincidencia.join('\n- ');
    }
    alert(msg);
    estado.style.display = 'none';
  } catch (err) {
    estado.className = 'error';
    estado.textContent = 'Error: ' + err.message;
  } finally {
    botones.forEach(b => { b.disabled = false; });
    input.value = '';
  }
}

// --- BUSCADOR MANUAL ---
function abrirBuscador() {
  document.getElementById('buscador-wrapper').style.display = 'block';
  document.getElementById('input-buscar').focus();
}

function cerrarBuscador() {
  document.getElementById('buscador-wrapper').style.display = 'none';
  document.getElementById('input-buscar').value = '';
  document.getElementById('resultados-busqueda').innerHTML = '';
}

function filtrar() {
  const q = document.getElementById('input-buscar').value.toLowerCase();
  const cont = document.getElementById('resultados-busqueda');
  cont.innerHTML = '';
  if (q.length < 2) return;

  productos.filter(p => (p.id + ' ' + p.nombre).toLowerCase().includes(q)).slice(0, 10).forEach(p => {
    const d = document.createElement('div');
    d.className = 'resultado';
    d.innerHTML = `<strong>${p.nombre}</strong> <span style="color:var(--suave);font-size:12px;">(${p.id})</span>`;
    d.onclick = () => agregarLinea(p);
    cont.appendChild(d);
  });
}

function agregarLinea(p) {
  cerrarBuscador();
  const cant = prompt(`¿Cuántas unidades de ${p.nombre} llegaron?`);
  if (!cant || isNaN(cant)) return;

  lineasAgregadas.push({
    id_producto: p.id,
    nombre: p.nombre,
    unidad: p.unidad_base || 'Unidad',
    cantidad: Number(cant)
  });

  renderizarLineas();
}

// --- RENDERIZADO DE LA LISTA ---
function renderizarLineas() {
  const cont = document.getElementById('lista-lineas');
  if (lineasAgregadas.length === 0) {
    cont.innerHTML = '<p style="text-align: center; color: var(--suave); font-size: 14px;">No hay productos agregados.</p>';
    return;
  }

  cont.innerHTML = '';
  lineasAgregadas.forEach((l, index) => {
    const div = document.createElement('div');
    div.className = 'linea';
    
    // Hacemos la línea clickeable para editar la cantidad
    div.innerHTML = `
      <div class="linea-info" onclick="editarCantidad(${index})">
        <h4>${l.nombre} <span class="badge-unidad">${l.unidad}</span></h4>
        <p>${l.cantidad} ${l.unidad.toLowerCase()}(s) (Toca para editar)</p>
      </div>
      <button class="btn-eliminar" onclick="eliminarLinea(${index})">×</button>
    `;
    cont.appendChild(div);
  });
}

// --- EDICIÓN RÁPIDA DE CANTIDAD ---
function editarCantidad(index) {
  const actual = lineasAgregadas[index].cantidad;
  const nueva = prompt(`Editar cantidad de ${lineasAgregadas[index].nombre}:`, actual);
  if (nueva !== null && nueva !== '' && !isNaN(nueva)) {
    lineasAgregadas[index].cantidad = Number(nueva);
    renderizarLineas();
  }
}

function eliminarLinea(index) {
  lineasAgregadas.splice(index, 1);
  renderizarLineas();
}

// --- GUARDAR ENTRADA (POST) ---
async function guardarEntrada() {
  const factura = document.getElementById('factura').value.trim();
  const proveedor = document.getElementById('proveedor').value;

  if (!factura) return alert('Escribe el número de factura');
  if (!proveedor) return alert('Selecciona un proveedor');
  if (lineasAgregadas.length === 0) return alert('Agrega al menos un producto');

  const btn = document.getElementById('btn-guardar');
  btn.textContent = 'Guardando...';
  btn.disabled = true;

  const datos = {
    factura: factura,
    proveedor: proveedor,
    fecha: new Date().toISOString().split('T')[0],
    lineas: lineasAgregadas
  };

  try {
    const r = await apiPost({ accion: 'guardar_entrada', datos: datos });

    if (r.ok) {
      alert('¡Recepción guardada con éxito! ID: ' + r.id_entrada);
      location.reload(); // Recargar para limpiar
    } else {
      alert('Error: ' + r.error);
    }
  } catch (err) {
    alert('Error de conexión: ' + err.message);
  } finally {
    btn.textContent = 'Guardar Recepción';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
