<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ArquiDulces</title>
<style>
  :root {
    --bg: #0F111A; --card: #1A1D2D; --texto: #F8FAFC; --suave: #94A3B8; --borde: #334155; --acento: #F59E0B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--texto); padding: 24px; min-height: 100vh; }
  
  h1 { font-size: 32px; font-weight: 800; color: var(--acento); letter-spacing: -1px; margin-top: 20px; }
  p.sub { color: var(--suave); font-size: 15px; margin-bottom: 40px; margin-top: 8px; }

  .card {
    background: var(--card); border: 1px solid var(--borde); border-radius: 20px;
    padding: 24px; display: flex; align-items: center; gap: 20px;
    text-decoration: none; color: var(--texto); margin-bottom: 16px;
    transition: transform 0.2s;
  }
  .card:active { transform: scale(0.98); }
  .icon { width: 56px; height: 56px; border-radius: 16px; background: rgba(245, 158, 11, 0.15); color: var(--acento); display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .card-text h2 { font-size: 18px; margin-bottom: 4px; }
  .card-text p { font-size: 13px; color: var(--suave); }
</style>
</head>
<body>
  <h1>ArquiDulces</h1>
  <p class="sub">Selecciona una opción</p>

  <a href="inventario.html" class="card">
    <div class="icon">📦</div>
    <div class="card-text">
      <h2>Inventario</h2>
      <p>Stock y ajustes</p>
    </div>
  </a>

  <div class="card" style="opacity: 0.5;">
    <div class="icon">📥</div>
    <div class="card-text">
      <h2>Recepciones</h2>
      <p>Próximamente...</p>
    </div>
  </div>
</body>
</html>
